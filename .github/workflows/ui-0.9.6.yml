# Trigger UI 0.9.6 patch
name: UI 0.9.6

on:
  push:
    paths:
      - '.github/workflows/ui-0.9.6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch UI
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('sample_patch.js')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '/* ConLang Generator UI + phonology patch — v0.9.4 */',
              '/* ConLang Generator UI + phonology patch — v0.9.6 */',
              1,
          )
          s = s.replace(
              "const VERSION = '0.9.4';",
              "const VERSION = '0.9.6';",
              1,
          )

          old_css = """        s.textContent = '.base-parameters{margin-top:16px}.base-parameters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.base-parameters .param-group{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px}.base-parameters .param-title{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);margin-bottom:7px}.base-parameters .param-value{color:var(--text);line-height:1.5}';"""
          if old_css in s:
              new_css = """        s.textContent = `
              .base-parameters {
                  margin-top: 16px;
              }

              .base-parameters-grid {
                  display: grid;
                  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                  gap: 12px;
              }

              .base-parameters .param-group {
                  background: var(--panel2);
                  border: 1px solid var(--line);
                  border-radius: 8px;
                  padding: 11px;
              }

              .base-parameters .param-title {
                  font-size: 11px;
                  text-transform: uppercase;
                  letter-spacing: .04em;
                  color: var(--accent);
                  margin-bottom: 7px;
              }

              .base-parameters .param-value {
                  color: var(--text);
                  line-height: 1.5;
              }

              .compact-grid {
                  align-items: start;
              }

              .compact-grid > .field {
                  margin-top: 0;
              }

              .header-tools #copy-vocabulary {
                  white-space: nowrap;
              }
          `;"""
              s = s.replace(old_css, new_css, 1)
          else:
              raise SystemExit('Expected CSS block not found')

          marker = """    function tab() {"""
          if "function installCopyButton()" not in s:
              function = r'''    function installCopyButton() {
          const exportButton = $('export-vocabulary');
          const existing = $('copy-vocabulary');

          if (existing || !exportButton) return;

          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'btn';
          button.id = 'copy-vocabulary';
          button.textContent = 'Copy to Clipboard';
          exportButton.insertAdjacentElement('beforebegin', button);

          button.addEventListener('click', async () => {
              const rows = [...document.querySelectorAll('#lexicon-output .lex-row')];
              const entries = rows
                  .map(row => {
                      const cells = row.children;
                      return {
                          word: cells[0]?.textContent.trim() || '',
                          english: cells[1]?.textContent.trim() || '',
                          meta: cells[2]?.textContent.trim() || ''
                      };
                  })
                  .filter(entry => entry.word && entry.english);

              if (!entries.length) {
                  const message = $('message');
                  if (message) {
                      message.textContent =
                          'Generate a language before copying its vocabulary.';
                  }
                  return;
              }

              const text = entries
                  .map(entry => [entry.word, entry.english, entry.meta]
                      .filter(Boolean)
                      .join('\t'))
                  .join('\n');

              try {
                  await navigator.clipboard.writeText(text);
              } catch {
                  const area = document.createElement('textarea');
                  area.value = text;
                  area.setAttribute('readonly', '');
                  area.style.position = 'fixed';
                  area.style.opacity = '0';
                  document.body.appendChild(area);
                  area.select();
                  document.execCommand('copy');
                  area.remove();
              }

              const message = $('message');
              if (message) {
                  message.textContent =
                      `Copied ${entries.length} vocabulary entries to the clipboard.`;
              }

              button.textContent = 'Copied';
              setTimeout(() => {
                  button.textContent = 'Copy to Clipboard';
              }, 1200);
          });
      }

'''
              if marker not in s:
                  raise SystemExit('Tab marker not found')
              s = s.replace(marker, function + marker, 1)

          s = s.replace(
              "        styles();\n        installModelOptions();",
              "        styles();\n        installCopyButton();\n        installModelOptions();",
              1,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          node --check sample_patch.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample_patch.js
          git rm .github/workflows/ui-0.9.6.yml
          git commit -m 'Add vocabulary clipboard button and align controls'
          git push
