name: Restore formatted index

on:
  push:
    paths:
      - '.github/workflows/restore-index.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index from pre-regression commit
        run: |
          git checkout 0b08a6f027225814daaeb669000b405cf37193fe -- index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v0.11.28', 'v0.11.29')
          s = s.replace('sample_patch.js?v=0.11.28', 'sample_patch.js?v=0.11.29')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify restored index
        run: |
          grep -q 'v0.11.29' index.html
          grep -q 'sample_patch.js?v=0.11.29' index.html
          node --check morphology_example_patch.js
          node --check sentence_audit_patch.js
          node --check version.js

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/restore-index.yml
          git commit -m 'Restore formatted index and align v0.11.29'
          git push
