name: Bump index version to 0.11.10

on:
  push:
    paths:
      - '.github/workflows/bump-version-01110.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'id="app-version" class="chip">v0.11.8</span>'
          new = 'id="app-version" class="chip">v0.11.10</span>'
          if old not in s:
              raise SystemExit('Expected index version marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/bump-version-01110.yml
          git commit -m 'Set index version to 0.11.10'
          git push
