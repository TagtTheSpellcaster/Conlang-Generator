name: Complete v0.11.23

on:
  push:
    paths:
      - '.github/workflows/complete-v0-11-23.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.11.23 changes
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('conlang_engine.js')
          s = engine.read_text(encoding='utf-8')
          old = "            'today', 'tomorrow', 'yesterday', 'who', 'what', 'where', 'when', 'why', 'how',\n            'many', 'all', 'nothing', 'not', 'can', 'have', 'be', 'to', 'from', 'with', 'in', 'forest',"
          new = "            'today', 'tomorrow', 'yesterday', 'who', 'what', 'where', 'when', 'why', 'how',\n            'many', 'all', 'nothing', 'not', 'can', 'have', 'be', 'to', 'from', 'with', 'in', 'forest', 'good',"
          if old not in s:
              raise SystemExit('Expected required-concepts block not found')
          s = s.replace(old, new, 1)

          old = "        const forestEntry = ranked.find(e => norm(e.concept) === 'forest');\n        if (!selected.some(e => norm(e.concept) === 'forest')) {\n            selected.unshift(forestEntry || { id: '__example_forest__', concept: 'forest', word_type: 'noun', scope: 'universal' });\n        }\n        return selected.slice(0, 600);"
          new = "        const forestEntry = ranked.find(e => norm(e.concept) === 'forest');\n        if (!selected.some(e => norm(e.concept) === 'forest')) {\n            selected.unshift(forestEntry || { id: '__example_forest__', concept: 'forest', word_type: 'noun', scope: 'universal' });\n        }\n        const goodEntry = ranked.find(e => norm(e.concept) === 'good' && (e.kind === 'adjective' || norm(e.word_type) === 'adjective'));\n        if (!selected.some(e => norm(e.concept) === 'good')) {\n            selected.unshift(goodEntry || { id: '__example_good__', concept: 'good', word_type: 'adjective', scope: 'universal' });\n        }\n        return selected.slice(0, 600);"
          if old not in s:
              raise SystemExit('Expected forest guarantee block not found')
          s = s.replace(old, new, 1)
          engine.write_text(s, encoding='utf-8')

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          if 'v0.11.22' not in s:
              raise SystemExit('Expected v0.11.22 marker not found in index.html')
          s = s.replace('v0.11.22', 'v0.11.23')
          index.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript
        run: |
          node --check conlang_engine.js
          node --check morphology_example_patch.js
          node --check version.js

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conlang_engine.js index.html
          git rm .github/workflows/complete-v0-11-23.yml
          git commit -m 'Update adjective example and version to 0.11.23'
          git push
