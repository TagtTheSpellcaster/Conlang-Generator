name: Complete morphology repair 0.11.30

on:
  push:
    paths:
      - '.github/workflows/morphology-repair-031.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')

          # Exactly one Gender selector, immediately before the existing Number selector.
          gender_field = '''<div class="field"><label for="gender">Gender</label><select id="gender">
                      <option value="masculine-feminine">Masculine + feminine</option>
                      <option value="masculine-feminine-neuter">Masculine + feminine + neuter</option>
                    </select></div>'''
          s = re.sub(r'\s*<div class="field"><label for="gender">Gender</label><select id="gender">.*?</select></div>', '', s, flags=re.S)
          s, n = re.subn(r'(<div class="field"><label for="number">Number</label><select id="number">)', gender_field + r'\1', s, count=1)
          if n != 1:
              raise SystemExit('Could not restore Gender selector before Number')

          # The UI version and all index cache-busters are synchronized for this release.
          s = re.sub(r'v0\.11\.29', 'v0.11.30', s)
          s = re.sub(r'v0\.11\.28', 'v0.11.30', s)
          index.write_text(s, encoding='utf-8')

          ui = Path('generator_ui.js')
          u = ui.read_text(encoding='utf-8')
          line = "            gender: $('gender')?.value || 'masculine-feminine',\n"
          if line not in u:
              needle = "            number: $('number')?.value || 'singular-plural',\n"
              if needle not in u:
                  raise SystemExit('Number config line not found')
              u = u.replace(needle, needle + line, 1)
          ui.write_text(u, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="gender"') == 1
          assert s.count('id="number"') == 1
          assert 'v0.11.30' in s
          assert 'v0.11.29' not in s
          assert 'v0.11.28' not in s
          u = Path('generator_ui.js').read_text(encoding='utf-8')
          assert "gender: $('gender')?.value || 'masculine-feminine'" in u
          PY
          node --check generator_ui.js
          node --check morphology_example_patch.js
          node --check sentence_audit_patch.js
          node --check sample_patch.js
          node --check conlang_engine.js
          node --check phonology.js
          node --check version.js

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html generator_ui.js
          git rm .github/workflows/morphology-repair-030.yml .github/workflows/morphology-repair-031.yml
          git commit -m 'Complete morphology control repair 0.11.30'
          git push
