name: Fix stale version reference

on:
  push:
    paths:
      - '.github/workflows/fix-version-ref.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix index.html version reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'sample_patch.js?v=0.11.27'
          new = 'sample_patch.js?v=0.11.28'
          if old not in s:
              raise SystemExit('Expected stale sample_patch version reference not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify exact version references
        run: |
          grep -o 'v0\.11\.[0-9]*' index.html
          test "$(grep -o 'sample_patch.js?v=0.11.[0-9]*' index.html | tail -1)" = 'sample_patch.js?v=0.11.28'

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-version-ref.yml
          git commit -m 'Align sample patch cache version with UI version'
          git push
