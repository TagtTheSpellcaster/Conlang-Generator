name: Hardwire application version 0.11.20
on:
  push:
    paths:
      - '.github/workflows/version-0.11.2.yml'
permissions:
  contents: write
jobs:
  hardwire-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update index version only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<span id="app-version" class="chip">v0.11.19</span>'
          new = '<span id="app-version" class="chip">v0.11.20</span>'
          if old not in s:
              raise SystemExit('Expected hardwired version not found in index.html')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify index version
        run: |
          grep -F '<span id="app-version" class="chip">v0.11.20</span>' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hardwire application version 0.11.20 in index'
          git push
