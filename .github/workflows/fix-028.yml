name: Prepare v0.11.28

on:
  push:
    paths:
      - '.github/workflows/fix-028.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # One authoritative Number selector. The morphology patch must not create another one.
          replace_once(
              'morphology_example_patch.js',
              "    function installNumberSelector() {\n        if (document.getElementById('morph-number')) return;\n        const plural = document.getElementById('plural');\n        if (!plural) return;\n        const field = plural.closest('.field');\n        if (!field) return;\n        const wrapper = document.createElement('div');\n        wrapper.className = 'field';\n        wrapper.innerHTML = '<label for=\"morph-number\">Number</label><select id=\"morph-number\"><option value=\"singular\">Singular only</option><option value=\"singular-plural\" selected>Singular + plural</option><option value=\"singular-plural-dual\">Singular + plural + dual</option></select>';\n        field.insertAdjacentElement('afterend', wrapper);\n    }\n\n",
              ''
          )
          replace_once('morphology_example_patch.js', "document.getElementById('morph-number')?.value || 'singular-plural'", "document.getElementById('number')?.value || 'singular-plural'")
          replace_once('morphology_example_patch.js', "        installNumberSelector();\n", '')
          replace_once('morphology_example_patch.js', "document.getElementById('morph-number')?.addEventListener('change', schedule);", "document.getElementById('number')?.addEventListener('change', schedule);")

          # Generator UI must pass the single Number selector into the engine.
          replace_once(
              'generator_ui.js',
              "plural: $('plural')?.value || 'suffix', relations:",
              "plural: $('plural')?.value || 'suffix', number: $('number')?.value || 'singular-plural', relations:"
          )
          replace_once(
              'generator_ui.js',
              "        const used = new Set(Object.values(endings).filter(Boolean));\n        const pluralMarker = generateNumberMarker(config, used);",
              "        const used = new Set(Object.values(endings).filter(Boolean));\n        const pluralMarker = morphemes.numberMarkers?.plural || '';"
          )
          replace_once(
              'generator_ui.js',
              "['vowels', 'consonants', 'word-order', 'morphology', 'adj-position', 'articles', 'plural', 'relations']",
              "['vowels', 'consonants', 'word-order', 'morphology', 'adj-position', 'articles', 'plural', 'number', 'relations']"
          )

          # Add the selector to index.html if it is not already present, immediately after Plural.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          number_field = '<div class="field"><label for="number">Number</label><select id="number"><option value="singular">Singular only</option><option value="singular-plural" selected>Singular + plural</option><option value="singular-plural-dual">Singular + plural + dual</option></select></div>'
          if 'id="number"' not in s:
              marker = '<div class="field"><label for="plural">Plural</label><select id="plural"><option value="suffix">Suffix</option><option value="prefix">Prefix</option><option value="none">No productive plural</option></select></div>'
              if marker not in s:
                  raise SystemExit('Plural selector not found in index.html')
              s = s.replace(marker, marker + number_field, 1)
          if 'v0.11.27' not in s:
              raise SystemExit('Expected v0.11.27 not found in index.html')
          s = s.replace('v0.11.27', 'v0.11.28')
          p.write_text(s, encoding='utf-8')

          # Keep cache-busting aligned with the hardwired UI version.
          for name in ['version.js']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              s = s.replace('morphology_example_patch.js?v=0.11.27', 'morphology_example_patch.js?v=0.11.28')
              s = s.replace('sentence_audit_patch.js?v=0.11.27', 'sentence_audit_patch.js?v=0.11.28')
              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript
        run: |
          node --check conlang_engine.js
          node --check generator_ui.js
          node --check morphology_example_patch.js
          node --check sentence_audit_patch.js
          node --check sentence_engine.js
          node --check phonology.js
          node --check version.js

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html conlang_engine.js generator_ui.js morphology_example_patch.js version.js
          git rm .github/workflows/fix-028.yml
          git commit -m 'Fix required sample vocabulary and unified number selector'
          git push
