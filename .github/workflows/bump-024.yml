name: Prepare v0.11.24

on:
  push:
    paths:
      - '.github/workflows/bump-024.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update hardwired UI version
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'v0.11.23' not in s:
              raise SystemExit('Expected v0.11.23 not found in index.html')
          s = s.replace('v0.11.23', 'v0.11.24')
          s = s.replace('sample_patch.js?v=0.11.22', 'sample_patch.js?v=0.11.24')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript
        run: |
          node --check sentence_engine.js
          node --check morphology_example_patch.js
          node --check sample_patch.js
          node --check conlang_engine.js
          node --check phonology.js
          node --check generator_ui.js

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/bump-024.yml
          git commit -m 'Bump UI version to 0.11.24'
          git push
