name: Prepare v0.11.27

on:
  push:
    paths:
      - '.github/workflows/bump-027.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update hardwired UI version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'v0.11.25' in s:
              s = s.replace('v0.11.25', 'v0.11.27')
          elif 'v0.11.26' in s:
              s = s.replace('v0.11.26', 'v0.11.27')
          else:
              raise SystemExit('No previous hardwired UI version found in index.html')
          s = s.replace('sample_patch.js?v=0.11.24', 'sample_patch.js?v=0.11.27')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify JavaScript
        run: |
          node --check sentence_engine.js
          node --check sentence_audit_patch.js
          node --check morphology_example_patch.js
          node --check sample_patch.js
          node --check conlang_engine.js
          node --check phonology.js
          node --check generator_ui.js
          node --check version.js

      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/bump-027.yml
          git commit -m 'Bump UI version to 0.11.27'
          git push
