<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Generator Studio v2.13.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .tab-content { display: none; }
        .tab-content.active { display: block !important; }

        .tab-btn { color: #94a3b8; background-color: transparent; transition: all 0.2s ease-in-out; }
        .tab-btn:hover { color: #e2e8f0; }
        .tab-btn.active { color: #38bdf8 !important; background-color: #1e293b !important; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3); font-weight: 600; }

        .grammar-section { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 0.5rem; padding: 1.25rem; margin-bottom: 1rem; }
        .grammar-section h3 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; font-size: 1.1rem; font-weight: 600; }
        .grammar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .grammar-item { font-size: 0.875rem; line-height: 1.5; color: #cbd5e1; }
        .grammar-item strong { color: #f8fafc; }
        .card { background-color: #0f172a; border: 1px solid #1e293b; padding: 0.85rem; border-radius: 0.5rem; }
        .card .conlang-word { color: #38bdf8; font-weight: 700; font-size: 1.05rem; }
        .card .category-tag { display: inline-block; font-size: 0.7rem; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 0.1rem 0.4rem; border-radius: 0.25rem; margin-bottom: 0.4rem; text-transform: uppercase; font-weight: 600; }
        .card .translation { color: #94a3b8; font-size: 0.875rem; }
        .section-header { font-weight: 700; color: #38bdf8; margin: 1.5rem 0 0.75rem 0; border-bottom: 1px solid #1e293b; padding-bottom: 0.25rem; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .dialogue-box { background-color: #0f172a; border: 1px solid #1e293b; padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; }
        .dialogue-box h4 { color: #38bdf8; font-weight: 600; margin-bottom: 0.75rem; font-size: 0.95rem; }
        .dialogue-line { margin-bottom: 0.6rem; font-size: 0.9rem; }
        .speaker { font-weight: 700; color: #38bdf8; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-sky-500 selection:text-white">

    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-md shadow-sky-500/20">
                C
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    Conlang Generator Studio
                    <span id="conlang-title-badge" class="text-xs bg-sky-950 text-sky-400 border border-sky-800/60 px-2.5 py-0.5 rounded-full font-medium">Language: Unnamed</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center space-x-3 mt-2 sm:mt-0">
            <span class="text-xs font-mono bg-slate-800 text-slate-400 px-2.5 py-1 rounded border border-slate-700">v2.13.0</span>
        </div>
    </header>

    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <aside class="w-full lg:w-96 bg-slate-900/90 border-r border-slate-800 p-5 overflow-y-auto flex flex-col space-y-5">
            <button id="quick-generate-btn" class="w-full py-3 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-lg shadow-lg shadow-emerald-900/20 active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
                <span>⚡ One-Click Generate</span>
            </button>

            <div class="border-t border-slate-800 pt-4 space-y-4">
                <h2 class="text-xs font-semibold text-sky-400 uppercase tracking-wider">Aesthetic & Cultural Settings</h2>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Aesthetic Profile</label>
                    <select id="descriptive-preset" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition-colors">
                        <option value="musical">Musical / Melodic</option>
                        <option value="dark">Dark / Guttural</option>
                        <option value="magical">Magical / Ethereal</option>
                        <option value="aquatic">Aquatic / Fluid</option>
                        <option value="harsh">Harsh / Rigid</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Cultural & Temporal Setting</label>
                    <select id="cultural-preset" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition-colors">
                        <option value="primitive">Tribal / Primal Era</option>
                        <option value="ancient">Ancient Empire</option>
                        <option value="medieval">Medieval Fantasy</option>
                        <option value="renaissance">Renaissance Guilds</option>
                        <option value="african">Sub-Saharan Nomadic</option>
                        <option value="alien">Extraterrestrial Sci-Fi</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Sociolinguistic Context</label>
                    <select id="sociological-preset" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition-colors">
                        <option value="egalitarian">Tribal / Communal Egalitarianism</option>
                        <option value="hierarchical">Hierarchical Feudal Imperial</option>
                        <option value="mercantile">Mercantile Trade Guild</option>
                        <option value="monastic">Isolationist Monastic Order</option>
                    </select>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-4 space-y-4">
                <h2 class="text-xs font-semibold text-sky-400 uppercase tracking-wider">Phonology & Syllable Rules</h2>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Mean Syllables</label>
                        <input type="number" id="mean-length" value="2.5" step="0.1" min="1.0" max="4.5" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Std Deviation</label>
                        <input type="number" id="std-dev" value="0.8" step="0.1" min="0.1" max="2.0" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Vowel Inventory</label>
                    <select id="vowel-inventory" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="standard">Standard (a, e, i, o, u)</option>
                        <option value="minimal">Minimalist (a, i, u)</option>
                        <option value="extended">Extended (a, e, i, o, u, y, ø, æ)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Consonant Density</label>
                    <select id="consonant-inventory" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="balanced">Balanced (Plosives, Nasals, Fricatives)</option>
                        <option value="guttural">Guttural Heavy (Velar, Uvular Focus)</option>
                        <option value="sibilant">Sibilant & Liquid Heavy (s, z, sh, r, l)</option>
                        <option value="soft">Soft Approximant (m, n, l, r, w, j)</option>
                    </select>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-4 space-y-4">
                <h2 class="text-xs font-semibold text-sky-400 uppercase tracking-wider">Morphosyntax & Typology</h2>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Morphological Strategy</label>
                    <select id="morphology-type" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="agglutinative">Agglutinative (Affix Stacking)</option>
                        <option value="isolating">Isolating / Fusional (Stem Preservation)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Grammatical Relations Strategy</label>
                    <select id="grammar-strategy" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="cases">Inflectional Case Endings</option>
                        <option value="prepositions">Prepositional / Word-Order Based</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Article System</label>
                    <select id="article-mode" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="both">Definite & Indefinite</option>
                        <option value="definite_only">Definite Only</option>
                        <option value="indefinite_only">Indefinite Only</option>
                        <option value="partitive">Definite, Indefinite & Partitive</option>
                        <option value="none">Zero Articles (No Articles)</option>
                    </select>
                </div>
            </div>

            <button id="custom-generate-btn" class="w-full py-2.5 px-4 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-lg shadow-md shadow-sky-900/30 transition-all text-sm">
                Generate Custom Conlang
            </button>
        </aside>

        <main class="flex-1 flex flex-col bg-slate-950 p-6 overflow-y-auto">
            
            <div class="flex flex-col space-y-4 mb-6 pb-4 border-b border-slate-800">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div class="relative flex-1 max-w-md w-full">
                        <input type="text" id="global-search-input" placeholder="Search term (Conlang/English)..." class="bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-lg px-3 py-2.5 w-full focus:outline-none focus:border-sky-500">
                        <div id="search-card-container" class="hidden absolute top-full left-0 mt-2 z-50 w-full bg-slate-900 border border-sky-500 rounded-lg p-3 shadow-xl"></div>
                    </div>

                    <div class="flex items-center space-x-2 flex-wrap gap-y-2">
                        <!-- Pulsante Vocabulary Manager -->
                        <a href="vocabulary.html" id="open-vocab-manager-btn" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow-md shadow-indigo-900/30 transition-all flex items-center space-x-1.5 decoration-0">
                            <span>📖 Vocabulary Manager</span>
                        </a>
                    
                        <button id="open-new-term-modal-btn" class="px-3.5 py-2 bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold rounded-lg shadow-md shadow-sky-900/30 transition-all flex items-center space-x-1.5">
                            <span>➕ New Term</span>
                        </button>
                        
                        <input type="file" id="import-json-input" accept=".json" class="hidden">
                        <button id="import-json-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition-all flex items-center space-x-1.5">
                            <span>📂 Import JSON</span>
                        </button>
                        <button id="export-json-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition-all flex items-center space-x-1.5">
                            <span>📥 Export JSON</span>
                        </button>
                        <button id="copy-json-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition-all flex items-center space-x-1.5">
                            <span>📋 Copy JSON</span>
                        </button>
                    </div>
                </div>

                <nav class="flex space-x-1 bg-slate-900 p-1 rounded-lg border border-slate-800 flex-wrap">
                    <button class="tab-btn px-4 py-2 text-xs font-semibold rounded-md active" data-tab="tab-grammar">Grammar Profile</button>
                    <button class="tab-btn px-4 py-2 text-xs font-semibold rounded-md" data-tab="tab-words">Vocabulary (600)</button>
                    <button class="tab-btn px-4 py-2 text-xs font-semibold rounded-md" data-tab="tab-dictionary">Dictionary</button>
                    <button class="tab-btn px-4 py-2 text-xs font-semibold rounded-md" data-tab="tab-sentences">Sentences (100)</button>
                    <button class="tab-btn px-4 py-2 text-xs font-semibold rounded-md" data-tab="tab-dialogues">Dialogues (20)</button>
                </nav>
            </div>

            <div id="tab-grammar" class="tab-content active space-y-6">
                <div id="grammar-container"></div>
            </div>

            <div id="tab-words" class="tab-content space-y-4">
                <div id="words-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
            </div>

            <div id="tab-dictionary" class="tab-content space-y-4">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-sm text-slate-400 font-medium">Dictionary Mode:</label>
                    <select id="dict-direction-select" class="bg-slate-900 border border-slate-800 text-sky-400 font-semibold text-xs rounded-lg px-3 py-2 focus:outline-none focus:border-sky-500">
                        <option value="conlang-english">Conlang ➔ English (Alphabetical)</option>
                        <option value="english-conlang">English ➔ Conlang (Alphabetical)</option>
                    </select>
                </div>
                <div class="overflow-x-auto border border-slate-800 rounded-lg shadow-lg">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead id="dict-table-head" class="bg-slate-900 border-b border-slate-800 text-sky-400 uppercase text-xs"></thead>
                        <tbody id="dict-table-body" class="divide-y divide-slate-800/60 bg-slate-950"></tbody>
                    </table>
                </div>
            </div>

            <div id="tab-sentences" class="tab-content space-y-4">
                <div id="sentences-container" class="space-y-4"></div>
            </div>

            <div id="tab-dialogues" class="tab-content space-y-4">
                <div id="dialogues-container" class="space-y-4"></div>
            </div>

        </main>
    </div>

    <!-- Modale "New Term" -->
    <div id="new-term-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl shadow-2xl max-w-md w-full p-6 space-y-5">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-sky-400">Add New Conlang Term</h3>
                <button id="modal-close-x-btn" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
            </div>

            <div id="modal-warning-alert" class="hidden bg-amber-950/60 border border-amber-800 text-amber-300 text-xs p-3 rounded-lg">
                ⚠️ Warning: This English term already exists in the dictionary as <strong id="modal-warning-term" class="mono-font text-amber-200">---</strong>. You can still save it.
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">English Translation</label>
                    <input type="text" id="modal-english-input" placeholder="e.g. sanctuary, to illuminate..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Part of Speech</label>
                    <select id="modal-pos-select" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="Noun">Noun</option>
                        <option value="Verb">Verb</option>
                        <option value="Adjective">Adjective</option>
                        <option value="Pronoun">Pronoun</option>
                        <option value="Possessive">Possessive</option>
                        <option value="Article">Article</option>
                        <option value="Grammatical Word">Grammatical Word</option>
                    </select>
                </div>

                <div class="flex items-center space-x-3 pt-2">
                    <button id="modal-create-term-btn" class="px-4 py-2 bg-teal-600 hover:bg-teal-500 text-white text-xs font-bold rounded-lg transition-all">
                        Create
                    </button>
                    <div class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 flex items-center justify-between">
                        <span class="text-xs text-slate-500 font-mono">Conlang:</span>
                        <span id="modal-conlang-output" class="text-sm font-bold text-sky-400 mono-font">---</span>
                    </div>
                </div>
            </div>

            <div class="flex justify-end space-x-2 border-t border-slate-800 pt-4">
                <button id="modal-cancel-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition-all">
                    Cancel
                </button>
                <button id="modal-ok-btn" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold rounded-lg transition-all shadow-md shadow-sky-900/30">
                    OK (Save)
                </button>
            </div>
        </div>
    </div>

    <!-- Script JS del Motore Esterno -->
    <script src="conlang_engine.js"></script>
</body>
</html>
