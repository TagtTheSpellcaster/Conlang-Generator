<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Generator Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .lang-name-badge {
            background-color: #0284c7;
            color: #ffffff;
            font-size: 0.95rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-weight: normal;
        }

        .version-tag {
            font-size: 0.85rem;
            background-color: var(--border);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }

        .content-area {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        select, input, button {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.55rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            outline: 1px solid var(--accent);
        }

        button.btn-primary {
            background-color: var(--accent);
            color: var(--bg-color);
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 0.75rem;
            margin-top: 0.5rem;
            transition: opacity 0.2s;
        }

        button.btn-primary:hover {
            opacity: 0.9;
        }

        .quick-action-btn {
            background-color: #059669;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 0.75rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-size: 0.95rem;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.8rem;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 0.8rem;
            border-radius: 4px;
        }

        .card .conlang-word {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.05rem;
        }

        .card .category-tag {
            display: inline-block;
            font-size: 0.7rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            margin-bottom: 0.4rem;
            text-transform: uppercase;
        }

        .card .translation {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .dialogue-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .dialogue-line {
            margin-bottom: 0.6rem;
        }

        .speaker {
            font-weight: bold;
            color: var(--accent);
        }

        .grammar-section {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.2rem;
            margin-bottom: 1rem;
        }

        .grammar-section h3 {
            margin-top: 0;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .grammar-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }

        .grammar-item {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .grammar-item strong {
            color: #f1f5f9;
        }

        .section-header {
            font-weight: bold;
            color: var(--accent);
            margin: 1rem 0 0.5rem 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.2rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Conlang Generator Studio <span id="conlang-title-badge" class="lang-name-badge">Language: Unnamed</span></h1>
        <span class="version-tag">v2.2.0</span>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <button id="quick-generate-btn" class="quick-action-btn">⚡ One-Click Generate</button>
            
            <hr style="border-color: var(--border); width: 100%; margin: 0;">

            <div class="form-group">
                <label for="descriptive-preset">Aesthetic Profile</label>
                <select id="descriptive-preset">
                    <option value="custom">Custom Configuration</option>
                    <option value="musical">Musical / Melodic</option>
                    <option value="dark">Dark / Guttural</option>
                    <option value="magical">Magical / Ethereal</option>
                    <option value="aquatic">Aquatic / Fluid</option>
                    <option value="harsh">Harsh / Rigid</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cultural-preset">Cultural & Temporal Profile</label>
                <select id="cultural-preset">
                    <option value="medieval">Medieval Fantasy</option>
                    <option value="ancient">Ancient Empire</option>
                    <option value="primitive">Tribal / Primitive</option>
                    <option value="renaissance">Renaissance High-Culture</option>
                    <option value="african">Sub-Saharan Inspired</option>
                    <option value="alien">Extraterrestrial Sci-Fi</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sociological-preset">Sociolinguistic Context</label>
                <select id="sociological-preset">
                    <option value="egalitarian">Tribal / Communal Egalitarianism</option>
                    <option value="hierarchical">Hierarchical Feudalism</option>
                    <option value="mercantile">Mercantile Trade Society</option>
                    <option value="monastic">Isolationist Monastic</option>
                </select>
            </div>

            <div style="display: flex; gap: 0.5rem;">
                <div class="form-group" style="flex: 1;">
                    <label for="mean-length">Mean Syllables</label>
                    <input type="number" id="mean-length" value="2.5" step="0.1" min="1.0" max="5.0">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="std-dev">Std Deviation</label>
                    <input type="number" id="std-dev" value="0.8" step="0.1" min="0.1" max="2.0">
                </div>
            </div>

            <div class="form-group">
                <label for="article-mode">Article Strategy</label>
                <select id="article-mode">
                    <option value="both">Definite & Indefinite</option>
                    <option value="definite_only">Definite Only</option>
                    <option value="indefinite_only">Indefinite Only</option>
                    <option value="partitive">Definite, Indefinite & Partitive</option>
                    <option value="none">No Articles</option>
                </select>
            </div>

            <div class="form-group">
                <label for="morphology-type">Morphological Structure</label>
                <select id="morphology-type">
                    <option value="agglutinative">Agglutinative (Stacked Affixes)</option>
                    <option value="isolating">Isolating / Fusional (Minimal Stacking)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="grammar-strategy">Grammatical Relations</label>
                <select id="grammar-strategy">
                    <option value="cases">Case Endings (Inflexional Suffixes)</option>
                    <option value="prepositions">Prepositions & Word Order</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vowel-inventory">Vowel Inventory Set</label>
                <select id="vowel-inventory">
                    <option value="standard">Standard (a, e, i, o, u)</option>
                    <option value="minimal">Minimal (a, i, u)</option>
                    <option value="extended">Extended (a, e, i, o, u, y, ø, æ)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="consonant-inventory">Consonant Density</label>
                <select id="consonant-inventory">
                    <option value="balanced">Balanced (Plosives, Nasals, Fricatives)</option>
                    <option value="guttural">Guttural Heavy (Velar, Uvular Focus)</option>
                    <option value="sibilant">Sibilant & Liquid Heavy (s, z, sh, r, l)</option>
                    <option value="soft">Soft (Nasals, Approximants Focus)</option>
                </select>
            </div>

            <button id="custom-generate-btn" class="btn-primary">Generate Custom Conlang</button>
        </aside>

        <main class="content-area">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="tab-grammar">Grammar Profile</button>
                    <button class="tab-btn" data-tab="tab-words">Vocabulary (600)</button>
                    <button class="tab-btn" data-tab="tab-sentences">Sentences (100)</button>
                    <button class="tab-btn" data-tab="tab-dialogues">Dialogues (20)</button>
                </div>
                
                <div style="display: flex; gap: 0.5rem;">
                    <button id="export-json-btn" class="btn-primary" style="margin-top: 0; padding: 0.5rem 0.8rem; font-size: 0.85rem;">Export JSON Table</button>
                    <button id="copy-json-btn" class="quick-action-btn" style="padding: 0.5rem 0.8rem; font-size: 0.85rem;">Copy JSON to Clipboard</button>
                </div>
            </div>

            <div id="tab-grammar" class="tab-content active">
                <div id="grammar-container"></div>
            </div>

            <div id="tab-words" class="tab-content">
                <div id="words-container" class="grid-list"></div>
            </div>

            <div id="tab-sentences" class="tab-content">
                <div id="sentences-container"></div>
            </div>

            <div id="tab-dialogues" class="tab-content">
                <div id="dialogues-container"></div>
            </div>
        </main>
    </div>

    <script src="conlang_engine.js"></script>
</body>
</html>
