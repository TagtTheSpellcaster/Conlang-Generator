<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Engine v3.3.0</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 1100px; width: 100%; }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header-title h1 { margin: 0; }
        .version-badge {
            background-color: var(--accent);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            box-sizing: border-box;
        }

        button.primary-btn {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button.primary-btn:hover { background-color: var(--accent-hover); }

        button.export-btn {
            background-color: var(--btn-green);
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button.export-btn:hover { background-color: var(--btn-green-hover); }

        .output-box {
            background-color: #020617;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px;
            white-space: pre-wrap;
            font-family: "Cascadia Code", "Courier New", Courier, monospace;
            font-size: 0.85rem;
            max-height: 600px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .actions-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>Advanced Conlang Engine</h1>
        <span class="version-badge">v3.3.0</span>
    </div>

    <div class="card">
        <button class="primary-btn" onclick="uiOneClickGenerate()">⚡ One-Click Quick Generation</button>
    </div>

    <div class="card">
        <h3>Configuration Parameters</h3>
        <div class="grid">
            <div>
                <label for="mean-length">Mean Word Length (Chars)</label>
                <input type="number" id="mean-length" value="5" min="3" max="10" step="0.5">
            </div>
            <div>
                <label for="std-dev">Std Deviation (Gaussian)</label>
                <input type="number" id="std-dev" value="1.2" min="0.2" max="3.0" step="0.1">
            </div>
            <div>
                <label for="desc">Phonotactic Style</label>
                <select id="desc">
                    <option value="harsh">Harsh / Imperial (Heavy Clusters)</option>
                    <option value="musical">Musical / Flowing (Strict CV)</option>
                    <option value="dark">Dark / Guttural (Clusters CCV)</option>
                    <option value="magic">Magical / Ethereal</option>
                    <option value="renaissance">Renaissance / Scholarly</option>
                    <option value="aquatic">Aquatic / Fluid</option>
                    <option value="none">Balanced / Natural</option>
                </select>
            </div>
            <div>
                <label for="socio">Sociolinguistic Structure</label>
                <select id="socio">
                    <option value="hierarchical">Hierarchical (Strict Honorifics)</option>
                    <option value="egalitarian">Egalitarian (No Honorifics)</option>
                    <option value="caste">Caste / Secret (Taboo Markers)</option>
                </select>
            </div>
            <div>
                <label for="culture">Socio-Temporal Setting</label>
                <select id="culture">
                    <option value="renaissance">Renaissance / Scholarly (SVO)</option>
                    <option value="ancient">Ancient / Archaic (SOV)</option>
                    <option value="primitive">Primitive / Tribal (SOV)</option>
                    <option value="medieval">Medieval / Nomadic (SVO)</option>
                    <option value="alien">Alien / Non-Human (OVS)</option>
                </select>
            </div>
        </div>

        <br>

        <div class="grid">
            <div>
                <label for="custom-vowels">Custom Vowels (comma separated)</label>
                <input type="text" id="custom-vowels" placeholder="a, e, i, o, u">
            </div>
            <div>
                <label for="custom-cons">Custom Consonants (comma separated)</label>
                <input type="text" id="custom-cons" placeholder="p, t, k, m, n, s, r, l">
            </div>
        </div>

        <br>
        <button class="primary-btn" onclick="uiGenerateCustomConlang()">Execute Engine & Render Interface</button>
    </div>

    <div class="card">
        <h3>Generated Engine Output & Universal Dynamic Log</h3>
        <div id="output" class="output-box">Select parameters and click generate...</div>
        
        <div class="actions-group">
            <button class="export-btn" onclick="uiExportJSON()">📥 Export Conlang Data (JSON)</button>
            <button class="export-btn" onclick="uiExportCSV()">📥 Export Dictionary (CSV)</button>
        </div>
    </div>
</div>

<!-- Collegamento al modulo motore JS separato -->
<script src="conlang_engine.js"></script>

<script>
let globalEngineResult = null;

function renderEngineLog(result) {
    let log = `=== CONLANG ENGINE v3.3.0 DISCOUPLED ARCHITECTURE ===\n`;
    log += `Style Mode               : ${result.metadata.desc.toUpperCase()}\n`;
    log += `Target Mean Word Length  : ${result.metadata.meanLength} (Std Dev: ${result.metadata.stdDev})\n`;
    log += `Canonical Word Order     : ${result.grammarRules.wordOrder}\n`;
    log += `Adjective Placement      : ${result.grammarRules.adjPosition} THE NOUN\n\n`;

    log += `=== DYNAMIC DIALOGUES (COMPILED AT RUNTIME) ===\n`;
    result.dialogues.forEach(d => {
        log += `\nDialogue #${d.id}: [${d.context}]\n`;
        d.turns.forEach(t => {
            log += `  Speaker ${t.speaker}: EN: "${t.englishTokens}" | CONLANG: "${t.conlangText}"\n`;
        });
    });

    log += `\n\n=== GENERATED LEXICON (${Object.keys(result.lexicon).length} Entries) ===\n`;
    log += `${"KEY / ID".padEnd(25, ' ')} | CONLANG WORD\n`;
    log += `-`.repeat(50) + `\n`;
    Object.keys(result.lexicon).forEach(key => {
        log += `${key.padEnd(25, ' ')} | ${result.lexicon[key]}\n`;
    });

    document.getElementById('output').innerText = log;
}

function uiGenerateCustomConlang() {
    const vInput = document.getElementById('custom-vowels').value;
    const cInput = document.getElementById('custom-cons').value;

    const config = {
        meanLength: parseFloat(document.getElementById('mean-length').value),
        stdDev: parseFloat(document.getElementById('std-dev').value),
        vowels: vInput ? vInput.split(',').map(s => s.trim()) : [],
        consonants: cInput ? cInput.split(',').map(s => s.trim()) : [],
        desc: document.getElementById('desc').value,
        socio: document.getElementById('socio').value,
        culture: document.getElementById('culture').value
    };

    globalEngineResult = executeConlangPipeline(config);
    renderEngineLog(globalEngineResult);
}

function uiOneClickGenerate() {
    const styles = ['harsh', 'musical', 'dark', 'magic', 'renaissance', 'aquatic', 'none'];
    const cultures = ['renaissance', 'ancient', 'primitive', 'medieval', 'alien'];

    const config = {
        meanLength: (Math.random() * 3 + 4).toFixed(1),
        stdDev: (Math.random() * 0.8 + 0.8).toFixed(1),
        vowels: [],
        consonants: [],
        desc: styles[Math.floor(Math.random() * styles.length)],
        socio: 'hierarchical',
        culture: cultures[Math.floor(Math.random() * cultures.length)]
    };

    document.getElementById('mean-length').value = config.meanLength;
    document.getElementById('std-dev').value = config.stdDev;
    document.getElementById('desc').value = config.desc;
    document.getElementById('culture').value = config.culture;

    globalEngineResult = executeConlangPipeline(config);
    renderEngineLog(globalEngineResult);
}

function uiExportJSON() {
    if (!globalEngineResult) return alert("Error: Generate a conlang first.");
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(globalEngineResult, null, 2));
    const btn = document.createElement('a');
    btn.setAttribute("href", dataStr);
    btn.setAttribute("download", `conlang_export_v3.3.0.json`);
    document.body.appendChild(btn);
    btn.click();
    btn.remove();
}

function uiExportCSV() {
    if (!globalEngineResult) return alert("Error: Generate a conlang first.");
    let csvContent = "data:text/csv;charset=utf-8,Key_ID,ConlangWord\n";
    Object.keys(globalEngineResult.lexicon).forEach(key => {
        csvContent += `"${key}","${globalEngineResult.lexicon[key]}"\n`;
    });
    const btn = document.createElement("a");
    btn.setAttribute("href", encodeURI(csvContent));
    btn.setAttribute("download", `conlang_lexicon.csv`);
    document.body.appendChild(btn);
    btn.click();
    btn.remove();
}
</script>

</body>
</html>
