<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Generator Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent);
        }

        .version-tag {
            font-size: 0.85rem;
            background-color: var(--border);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            color: var(--text-muted);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .content-area {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        select, input, button {
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0.6rem;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        select:focus, input:focus {
            outline: 1px solid var(--accent);
        }

        button.btn-primary {
            background-color: var(--accent);
            color: var(--bg-color);
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 0.8rem;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }

        button.btn-primary:hover {
            opacity: 0.9;
        }

        .quick-action-btn {
            background-color: #059669;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            padding: 0.8rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .grid-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.8rem;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 0.8rem;
            border-radius: 4px;
        }

        .card .conlang-word {
            color: var(--accent);
            font-weight: bold;
        }

        .card .translation {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .dialogue-box {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .dialogue-line {
            margin-bottom: 0.5rem;
        }

        .speaker {
            font-weight: bold;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <header>
        <h1>Conlang Generator Studio</h1>
        <span class="version-tag">v1.0.0</span>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <button id="quick-generate-btn" class="quick-action-btn">⚡ One-Click Generate</button>
            
            <hr style="border-color: var(--border); width: 100%;">

            <div class="form-group">
                <label for="descriptive-preset">Aesthetic & Descriptive Profile</label>
                <select id="descriptive-preset">
                    <option value="custom">Custom Configuration</option>
                    <option value="musical">Musical / Melodic</option>
                    <option value="dark">Dark / Guttural</option>
                    <option value="magical">Magical / Ethereal</option>
                    <option value="aquatic">Aquatic / Fluid</option>
                    <option value="harsh">Harsh / Rigid</option>
                </select>
            </div>

            <div class="form-group">
                <label for="cultural-preset">Cultural & Temporal Profile</label>
                <select id="cultural-preset">
                    <option value="medieval">Medieval Fantasy</option>
                    <option value="ancient">Ancient Empire</option>
                    <option value="primitive">Tribal / Primitive</option>
                    <option value="renaissance">Renaissance High-Culture</option>
                    <option value="african">Sub-Saharan Inspired</option>
                    <option value="alien">Extraterrestrial Sci-Fi</option>
                </select>
            </div>

            <div class="form-group">
                <label for="sociological-preset">Sociolinguistic Context</label>
                <select id="sociological-preset">
                    <option value="egalitarian">Egalitarian Nomads</option>
                    <option value="hierarchical">Hierarchical Feudalism</option>
                    <option value="mercantile">Mercantile Trade Society</option>
                    <option value="monastic">Isolationist Monastic</option>
                </select>
            </div>

            <div class="form-group">
                <label for="vowel-inventory">Vowel Inventory Set</label>
                <select id="vowel-inventory">
                    <option value="standard">Standard (a, e, i, o, u)</option>
                    <option value="minimal">Minimal (a, i, u)</option>
                    <option value="extended">Extended (a, e, i, o, u, y, ø, æ)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="consonant-inventory">Consonant Density</label>
                <select id="consonant-inventory">
                    <option value="balanced">Balanced (Plosives, Nasals, Fricatives)</option>
                    <option value="guttural">Guttural Heavy (Velar, Uvular Focus)</option>
                    <option value="sibilant">Sibilant & Liquid Heavy (s, z, sh, r, l)</option>
                    <option value="soft">Soft (Nasals, Approximants Focus)</option>
                </select>
            </div>

            <button id="custom-generate-btn" class="btn-primary">Generate Custom Conlang</button>
        </aside>

        <main class="content-area">
            <div class="tabs">
                <button class="tab-btn active" data-tab="tab-words">Vocabulary (600)</button>
                <button class="tab-btn" data-tab="tab-sentences">Sentences (50)</button>
                <button class="tab-btn" data-tab="tab-dialogues">Dialogues (20)</button>
            </div>

            <div id="tab-words" class="tab-content active">
                <div id="words-container" class="grid-list"></div>
            </div>

            <div id="tab-sentences" class="tab-content">
                <div id="sentences-container"></div>
            </div>

            <div id="tab-dialogues" class="tab-content">
                <div id="dialogues-container"></div>
            </div>
        </main>
    </div>

    <script src="conlang_engine.js"></script>
</body>
</html>
