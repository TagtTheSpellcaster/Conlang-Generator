<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Engine v3.2.0 - Universal Dynamic Parser</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 1100px; width: 100%; }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header-title h1 { margin: 0; }
        .version-badge {
            background-color: var(--accent);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            box-sizing: border-box;
        }

        button.primary-btn {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button.primary-btn:hover { background-color: var(--accent-hover); }

        button.export-btn {
            background-color: var(--btn-green);
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button.export-btn:hover { background-color: var(--btn-green-hover); }

        .output-box {
            background-color: #020617;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px;
            white-space: pre-wrap;
            font-family: "Cascadia Code", "Courier New", Courier, monospace;
            font-size: 0.85rem;
            max-height: 600px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .actions-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>Advanced Conlang Engine</h1>
        <span class="version-badge">v3.2.0</span>
    </div>

    <div class="card">
        <button class="primary-btn" onclick="generateRandomConlang()">⚡ One-Click Quick Generation</button>
    </div>

    <div class="card">
        <h3>Configuration Parameters</h3>
        <div class="grid">
            <div>
                <label for="mean-length">Mean Word Length (Chars)</label>
                <input type="number" id="mean-length" value="5" min="3" max="10" step="0.5">
            </div>
            <div>
                <label for="std-dev">Std Deviation (Gaussian)</label>
                <input type="number" id="std-dev" value="1.2" min="0.2" max="3.0" step="0.1">
            </div>
            <div>
                <label for="desc">Phonotactic Style</label>
                <select id="desc">
                    <option value="renaissance">Renaissance / Scholarly</option>
                    <option value="harsh">Harsh / Imperial (Heavy Clusters)</option>
                    <option value="musical">Musical / Flowing (Strict CV)</option>
                    <option value="dark">Dark / Guttural (Clusters CCV)</option>
                    <option value="magic">Magical / Ethereal</option>
                    <option value="aquatic">Aquatic / Fluid</option>
                    <option value="none">Balanced / Natural</option>
                </select>
            </div>
            <div>
                <label for="socio">Sociolinguistic Structure</label>
                <select id="socio">
                    <option value="hierarchical">Hierarchical (Strict Honorifics)</option>
                    <option value="egalitarian">Egalitarian (No Honorifics)</option>
                    <option value="caste">Caste / Secret (Taboo Markers)</option>
                </select>
            </div>
            <div>
                <label for="culture">Socio-Temporal Setting</label>
                <select id="culture">
                    <option value="renaissance">Renaissance / Scholarly (SVO)</option>
                    <option value="ancient">Ancient / Archaic (SOV)</option>
                    <option value="primitive">Primitive / Tribal (SOV)</option>
                    <option value="medieval">Medieval / Nomadic (SVO)</option>
                    <option value="alien">Alien / Non-Human (OVS)</option>
                </select>
            </div>
        </div>

        <br>

        <div class="grid">
            <div>
                <label for="custom-vowels">Custom Vowels (comma separated)</label>
                <input type="text" id="custom-vowels" placeholder="a, e, i, o, u">
            </div>
            <div>
                <label for="custom-cons">Custom Consonants (comma separated)</label>
                <input type="text" id="custom-cons" placeholder="p, t, k, m, n, s, r, l">
            </div>
        </div>

        <br>
        <button class="primary-btn" onclick="generateCustomConlang()">Execute Universal Runtime Parsing Engine (550+ Terms)</button>
    </div>

    <div class="card">
        <h3>Generated Engine Output & Universal Dynamic Output</h3>
        <div id="output" class="output-box">Select parameters and click generate...</div>
        
        <div class="actions-group">
            <button class="export-btn" onclick="exportJSON()">📥 Export Conlang Data (JSON)</button>
            <button class="export-btn" onclick="exportCSV()">📥 Export Dictionary (CSV)</button>
        </div>
    </div>
</div>

<script>
// --- PHONETICS DATA ---
const PHONETICS = {
    renaissance: { v: ['a', 'e', 'i', 'o'], c: ['t', 's', 'p', 'k', 'm', 'n', 'r', 'l', 'g'], maxC: 2, epenthetic: 'e' },
    musical:     { v: ['a', 'e', 'i', 'o'], c: ['m', 'n', 'l', 'r', 's', 'v'], maxC: 1, epenthetic: 'i' },
    dark:        { v: ['u', 'o', 'a'], c: ['k', 'g', 'q', 'x', 'r', 'z'], maxC: 3, epenthetic: 'u' },
    harsh:       { v: ['a', 'u'], c: ['p', 't', 'k', 'ts', 'tr', 'gr'], maxC: 3, epenthetic: 'a' },
    magic:       { v: ['a', 'i', 'e', 'ae'], c: ['s', 'sh', 'h', 'f', 'l', 'm', 'th'], maxC: 2, epenthetic: 'e' },
    aquatic:     { v: ['a', 'i', 'u', 'o'], c: ['m', 'n', 'l', 'w', 'f', 'v', 'bh'], maxC: 2, epenthetic: 'u' },
    none:        { v: ['a', 'e', 'i', 'o', 'u'], c: ['p', 't', 'k', 'b', 'd', 'g', 'm', 'n', 's', 'r', 'l'], maxC: 2, epenthetic: 'e' }
};

// --- CORE DICTIONARY BASE ---
const CORE_DICTIONARY_BASE = [
    { key: "i", en: "I", pos: "PRON" },
    { key: "you", en: "you", pos: "PRON" },
    { key: "you_formal", en: "you (formal)", pos: "PRON" },
    { key: "he", en: "he/she", pos: "PRON" },
    { key: "we", en: "we", pos: "PRON" },
    { key: "this", en: "this", pos: "DET" },
    { key: "that", en: "that", pos: "DET" },
    { key: "not", en: "not", pos: "PART" },
    { key: "past", en: "PAST", pos: "PART" },
    { key: "ques", en: "QUES", pos: "PART" },
    { key: "in", en: "in", pos: "PREP" },
    { key: "to", en: "to", pos: "PREP" },
    { key: "be", en: "be", pos: "V" },
    { key: "see", en: "see", pos: "V" },
    { key: "know", en: "know/understand", pos: "V" },
    { key: "seek", en: "seek/search", pos: "V" },
    { key: "go", en: "go/travel", pos: "V" },
    { key: "buy", en: "buy/trade", pos: "V" },
    { key: "pay", en: "pay/offer", pos: "V" },
    { key: "give", en: "give", pos: "V" },
    { key: "show", en: "show", pos: "V" },
    { key: "person", en: "person", pos: "N" },
    { key: "physician", en: "physician/healer", pos: "N" },
    { key: "scholar", en: "scholar/scribe", pos: "N" },
    { key: "merchant", en: "merchant", pos: "N" },
    { key: "guard", en: "guard/sentinel", pos: "N" },
    { key: "chief", en: "chief/leader", pos: "N" },
    { key: "academy", en: "academy", pos: "N" },
    { key: "city", en: "city", pos: "N" },
    { key: "gate", en: "gate", pos: "N" },
    { key: "road", en: "road/way", pos: "N" },
    { key: "map", en: "map/chart", pos: "N" },
    { key: "book", en: "book", pos: "N" },
    { key: "coin", en: "coin/money", pos: "N" },
    { key: "water", en: "water", pos: "N" },
    { key: "eye", en: "eye", pos: "N" },
    { key: "fire", en: "fire", pos: "N" },
    { key: "peace", en: "peace", pos: "N" },
    { key: "good", en: "good", pos: "ADJ" },
    { key: "new", en: "new", pos: "ADJ" },
    { key: "near", en: "near", pos: "ADJ" },
    { key: "clean", en: "clean", pos: "ADJ" }
];

// --- 1. MATRICE DEI CONCETTI UNIVERSALI (CONCEPT_MARKET) ---
const CONCEPT_MARKET = [
    { id: "landslide_earthquake", roots: ["earth", "fall"], pos: "N", category: "Domain_Nature", cultureMeanings: { primitive: "terremoto / terra che trema", medieval: "frana sulla strada", scholarly: "spostamento tettonico", renaissance: "movimento tellurico", alien: "instabilità sismica planetaria" } },
    { id: "study_learn", roots: ["go", "academy"], pos: "V", category: "Domain_Science", cultureMeanings: { primitive: "iniziazione / ascoltare gli anziani", medieval: "apprendistato presso la gilda", scholarly: "studiare / frequentare l'ateneo", renaissance: "frequentare l'accademia / apprendere le arti", alien: "assorbire informazioni dalla matrice" } },
    { id: "tear_sorrow", roots: ["eye", "water"], pos: "N", category: "Domain_Society", cultureMeanings: { primitive: "acqua degli occhi / pianto", medieval: "dolore / lacrima di pena", scholarly: "espressione di cordoglio", renaissance: "malinconia / espressione artistica", alien: "secrezione di sovraccarico sensoriale" } },
    { id: "aqueduct_fountain", roots: ["water", "city"], pos: "N", category: "Domain_Architecture", cultureMeanings: { primitive: "fiume dell'accampamento", medieval: "pozzo cittadino / fontana", scholarly: "acquedotto civico", renaissance: "fontana monumentale / impianto idrico", alien: "condotto di raffreddamento" } },
    { id: "doctor_healer", roots: ["person", "medicine"], pos: "N", category: "Domain_Society", cultureMeanings: { primitive: "sciamano / curatore", medieval: "cerusico / medico di campo", scholarly: "dottore in medicina", renaissance: "medico / anatomista", alien: "unità di riparazione biologica" } }
];

let currentConlangData = null;

function isVowel(ch) { return ['a', 'e', 'i', 'o', 'u', 'y'].includes(ch.toLowerCase()); }

function getGaussianLength(mean, stdDev) {
    let u1 = 0, u2 = 0;
    while (u1 === 0) u1 = Math.random();
    while (u2 === 0) u2 = Math.random();
    let z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
    let len = Math.round(mean + z0 * stdDev);
    return Math.max(2, Math.min(15, len));
}

function applyPhonotactics(partA, partB, maxC = 2, epenthetic = 'e') {
    let overlapLen = Math.min(partA.length, partB.length);
    for (let len = overlapLen; len >= 1; len--) {
        let suffixA = partA.slice(-len);
        let prefixB = partB.slice(0, len);
        if (suffixA.toLowerCase() === prefixB.toLowerCase()) {
            partA = partA.slice(0, -len);
            break;
        }
    }
    let str = partA + partB;
    if (isVowel(partA.slice(-1)) && isVowel(partB.charAt(0)) && partA.slice(-1) === partB.charAt(0)) {
        str = partA.slice(0, -1) + partB;
    }
    let cCount = 0;
    for (let i = 0; i < str.length; i++) {
        if (!isVowel(str[i])) {
            cCount++;
            if (cCount > maxC) {
                str = str.slice(0, i) + epenthetic + str.slice(i);
                break;
            }
        } else { cCount = 0; }
    }
    return str;
}

function applyExternalSandhi(wordsArray) {
    let resultSentence = [];
    for (let i = 0; i < wordsArray.length; i++) {
        let current = wordsArray[i];
        if (i < wordsArray.length - 1) {
            let next = wordsArray[i + 1];
            if (isVowel(current.slice(-1)) && isVowel(next.charAt(0)) && current.slice(-1) === next.charAt(0)) {
                current = current.slice(0, -1);
            }
        }
        resultSentence.push(current);
    }
    return resultSentence.join(' ');
}

// --- 2. PIPELINE DI TRADUZIONE DINAMICA (translatePhrase) ---
function translatePhrase(tokens, lexicon, grammarRules) {
    let subject = "", verb = "", object = "", adjective = "";
    let isNegative = false, isQuestion = false;

    tokens.forEach(token => {
        let raw = token.toLowerCase().trim();
        if (raw === "not" || raw === "no") { isNegative = true; return; }
        if (raw === "?") { isQuestion = true; return; }

        let conlangWord = lexicon[raw] || raw;

        if (["i", "you", "he", "we", "they", "guard", "scholar", "merchant", "person"].includes(raw)) {
            if (!subject) subject = conlangWord; else object = conlangWord;
        } else if (["see", "have", "seek", "buy", "pay", "give", "know", "go", "be"].includes(raw)) {
            verb = conlangWord;
        } else if (["good", "new", "clean", "near", "safe"].includes(raw)) {
            adjective = conlangWord;
        } else {
            object = conlangWord;
        }
    });

    let fullObject = object;
    if (object && adjective) {
        fullObject = (grammarRules.adjPosition === "BEFORE") ? `${adjective} ${object}` : `${object} ${adjective}`;
    }

    if (isNegative && verb) {
        let negPart = lexicon["not"] || "not";
        verb = `${negPart} ${verb}`;
    }

    let orderedPhrase = [];
    const wordOrder = grammarRules.wordOrder || "SVO";
    if (wordOrder === "SVO") orderedPhrase = [subject, verb, fullObject];
    else if (wordOrder === "SOV") orderedPhrase = [subject, fullObject, verb];
    else if (wordOrder === "OVS") orderedPhrase = [fullObject, verb, subject];

    orderedPhrase = orderedPhrase.filter(w => w && w.trim().length > 0);

    if (isQuestion) {
        let quesPart = lexicon["ques"] || "ques";
        orderedPhrase.unshift(quesPart);
    }

    return applyExternalSandhi(orderedPhrase);
}

// --- 3. MOTORE DEI DIALOGHI AD ALBERO LOGICO (DIALOGUE ENGINE) ---
const DIALOGUE_TEMPLATES = [
    { id: 1, contextTags: { primitive: "At the tribe campfire", medieval: "At the castle gate", scholarly: "University main hall", renaissance: "City gate checkpoint", alien: "Stasi portal" },
      turns: [{ text: ["you", "seek", "academy", "?"] }, { text: ["I", "seek", "physician"] }, { text: ["you", "have", "coin"] }, { text: ["I", "pay", "coin"] }] },
    { id: 2, contextTags: { primitive: "Bartering skins at stream", medieval: "Spice merchant trade", scholarly: "Rare manuscript purchase", renaissance: "Mapmaker workshop", alien: "Data tile exchange" },
      turns: [{ text: ["you", "have", "map", "?"] }, { text: ["I", "have", "good", "map"] }, { text: ["I", "buy", "map"] }, { text: ["you", "pay", "coin"] }] }
];

function buildFullConlangEngine(config) {
    const pData = PHONETICS[config.desc] || PHONETICS.renaissance;
    const v = config.vowels.length ? config.vowels : pData.v;
    const c = config.consonants.length ? config.consonants : pData.c;

    let wordOrder = 'SVO';
    if (config.culture === 'ancient' || config.culture === 'primitive') wordOrder = 'SOV';
    if (config.culture === 'alien') wordOrder = 'OVS';
    const adjPos = (config.culture === 'primitive' || config.culture === 'ancient') ? 'BEFORE' : 'AFTER';

    let lexicon = [];
    let wordMap = {};
    let usedWords = new Set();

    function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function makeRoot(targetLen) {
        let w = "", attempts = 0;
        do {
            w = "";
            while(w.length < targetLen) { w += getRandom(c); w += getRandom(v); }
            w = w.slice(0, targetLen); attempts++;
        } while (usedWords.has(w) && attempts < 50);
        usedWords.add(w);
        return w;
    }

    CORE_DICTIONARY_BASE.forEach(item => {
        let w = makeRoot(getGaussianLength(config.meanLength, config.stdDev));
        wordMap[item.key] = w;
        lexicon.push({ word: w, pos: item.pos, category: "Core Lexicon", meaning: item.en });
    });

    CONCEPT_MARKET.forEach(item => {
        let r1 = wordMap[item.roots[0]] || makeRoot(4);
        let r2 = wordMap[item.roots[1]] || makeRoot(4);
        let compWord = applyPhonotactics(r1, r2, pData.maxC, pData.epenthetic);
        let activeMeaning = item.cultureMeanings[config.culture] || item.cultureMeanings.scholarly;
        wordMap[item.id] = compWord;
        lexicon.push({ word: compWord, pos: item.pos, category: item.category, meaning: `${activeMeaning} [${r1} + ${r2}]` });
    });

    let grammarRules = { wordOrder: wordOrder, adjPosition: adjPos };

    // Dynamic Dialogues Parsing
    let generatedDialogues = DIALOGUE_TEMPLATES.map(template => {
        let contextTitle = template.contextTags[config.culture] || `Interaction #${template.id}`;
        let parsedTurns = template.turns.map(turn => ({
            englishTokens: turn.text.join(" "),
            conlangText: translatePhrase(turn.text, wordMap, grammarRules)
        }));
        return { dialogueId: template.id, context: contextTitle, turns: parsedTurns };
    });

    currentConlangData = { metadata: config, version: "v3.2.0", lexicon: lexicon, dialogues: generatedDialogues };

    let text = `=== CONLANG ENGINE v3.2.0 DYNAMIC PARSER LOG ===\n`;
    text += `Target Mean Word Length: ${config.meanLength} (Std Dev: ${config.stdDev})\n`;
    text += `Canonical Word Order    : ${wordOrder}\n`;
    text += `Adjective Placement     : ${adjPos} THE NOUN\n\n`;

    text += `=== SECTION B: DYNAMIC DIALOGUES (PARSED AT RUNTIME) ===\n`;
    generatedDialogues.forEach(d => {
        text += `\nDialogue #${d.dialogueId}: [${d.context}]\n`;
        d.turns.forEach((t, i) => {
            text += `  Turn ${i+1}: EN: "${t.englishTokens}" | CONLANG: "${t.conlangText}"\n`;
        });
    });

    text += `\n\n=== FULL DICTIONARY EXCERPT (${lexicon.length} Entries) ===\n`;
    text += `${"WORD".padEnd(20, ' ')} | ${"POS".padEnd(6, ' ')} | ${"CATEGORY".padEnd(22, ' ')} | MEANING / FORMULA\n`;
    text += `-`.repeat(85) + `\n`;
    lexicon.forEach(entry => {
        text += `${entry.word.padEnd(20, ' ')} | ${entry.pos.padEnd(6, ' ')} | ${entry.category.padEnd(22, ' ')} | ${entry.meaning}\n`;
    });

    return text;
}

function generateRandomConlang() {
    const config = { meanLength: 5, stdDev: 1.2, vowels: [], consonants: [], desc: 'renaissance', socio: 'hierarchical', culture: 'renaissance' };
    document.getElementById('output').innerText = buildFullConlangEngine(config);
}

function generateCustomConlang() {
    const vInput = document.getElementById('custom-vowels').value;
    const cInput = document.getElementById('custom-cons').value;
    const config = {
        meanLength: parseFloat(document.getElementById('mean-length').value),
        stdDev: parseFloat(document.getElementById('std-dev').value),
        vowels: vInput ? vInput.split(',').map(s => s.trim()) : [],
        consonants: cInput ? cInput.split(',').map(s => s.trim()) : [],
        desc: document.getElementById('desc').value,
        socio: document.getElementById('socio').value,
        culture: document.getElementById('culture').value
    };
    document.getElementById('output').innerText = buildFullConlangEngine(config);
}

function exportJSON() {
    if (!currentConlangData) return alert("Error: Generate a conlang first.");
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentConlangData, null, 2));
    const btn = document.createElement('a');
    btn.setAttribute("href", dataStr);
    btn.setAttribute("download", `conlang_v3.2.0_dynamic.json`);
    document.body.appendChild(btn); btn.click(); btn.remove();
}

function exportCSV() {
    if (!currentConlangData) return alert("Error: Generate a conlang first.");
    let csvContent = "data:text/csv;charset=utf-8,Word,POS,Category,Meaning\n";
    currentConlangData.lexicon.forEach(item => { csvContent += `"${item.word}","${item.pos}","${item.category}","${item.meaning}"\n`; });
    const btn = document.createElement("a");
    btn.setAttribute("href", encodeURI(csvContent));
    btn.setAttribute("download", `conlang_dictionary_3.2.0.csv`);
    document.body.appendChild(btn); btn.click(); btn.remove();
}
</script>

</body>
</html>
