<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Engine - Advanced Phonotactic & Morphological Pipeline</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --btn-green: #10b981;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 1100px; width: 100%; }
        h1, h3 { color: #f8fafc; margin-top: 0; }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            box-sizing: border-box;
        }

        button.primary-btn {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button.primary-btn:hover { background-color: var(--accent-hover); }

        .output-box {
            background-color: #020617;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px;
            white-space: pre-wrap;
            font-family: "Cascadia Code", "Courier New", Courier, monospace;
            font-size: 0.85rem;
            max-height: 550px;
            overflow-y: auto;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Advanced Conlang Engine - Pipeline Architecture</h1>

    <div class="card">
        <h3>Pipeline Parameters & Constraints</h3>
        <div class="grid">
            <div>
                <label for="mean-length">Mean Word Length</label>
                <input type="number" id="mean-length" value="5" min="3" max="10" step="0.5">
            </div>
            <div>
                <label for="std-dev">Std Deviation (Gaussian)</label>
                <input type="number" id="std-dev" value="1.2" min="0.2" max="3.0" step="0.1">
            </div>
            <div>
                <label for="desc">Phonotactic Style</label>
                <select id="desc">
                    <option value="musical">Musical / Flowing (Strict CV)</option>
                    <option value="dark">Dark / Guttural (Clusters CCV)</option>
                    <option value="harsh">Harsh / Imperial (Heavy Clusters)</option>
                    <option value="none">Balanced / Natural</option>
                </select>
            </div>
            <div>
                <label for="socio">Sociolinguistics</label>
                <select id="socio">
                    <option value="hierarchical">Hierarchical (Honorifics Active)</option>
                    <option value="egalitarian">Egalitarian (Flat Syntax)</option>
                </select>
            </div>
            <div>
                <label for="culture">Cultural Filter</label>
                <select id="culture">
                    <option value="renaissance">Renaissance / Scholarly</option>
                    <option value="primitive">Primitive / Tribal</option>
                    <option value="medieval">Medieval / Feudal</option>
                </select>
            </div>
        </div>
        <br>
        <button class="primary-btn" onclick="runPipelineEngine()">Execute Conlang Generation Pipelines</button>
    </div>

    <div class="card">
        <h3>Engine Output Log & Dictionary</h3>
        <div id="output" class="output-box">Click execute to run the pipelines...</div>
    </div>
</div>

<script>
const PHONETICS = {
    musical: { v: ['a', 'e', 'i', 'o'], c: ['m', 'n', 'l', 'r', 's', 'v'], maxC: 1, epenthetic: 'i' },
    dark:    { v: ['u', 'o', 'a'], c: ['k', 'g', 'q', 'x', 'r', 'z'], maxC: 3, epenthetic: 'u' },
    harsh:   { v: ['a', 'u'], c: ['p', 't', 'k', 'ts', 'tr', 'gr'], maxC: 3, epenthetic: 'a' },
    none:    { v: ['a', 'e', 'i', 'o', 'u'], c: ['p', 't', 'k', 'b', 'd', 'm', 'n', 's', 'r', 'l'], maxC: 2, epenthetic: 'e' }
};

function isVowel(ch) {
    return ['a', 'e', 'i', 'o', 'u', 'y'].includes(ch.toLowerCase());
}

function applyPhonotactics(partA, partB, styleKey) {
    const rules = PHONETICS[styleKey] || PHONETICS.none;
    let str = partA + partB;

    // 1. Elision on double identical vowels
    if (isVowel(partA.slice(-1)) && isVowel(partB.charAt(0)) && partA.slice(-1) === partB.charAt(0)) {
        str = partA.slice(0, -1) + partB;
    }

    // 2. Sandhi Epenthesis on heavy consonant cluster
    let cCount = 0;
    for (let i = 0; i < str.length; i++) {
        if (!isVowel(str[i])) {
            cCount++;
            if (cCount > rules.maxC) {
                str = str.slice(0, i) + rules.epenthetic + str.slice(i);
                break;
            }
        } else { cCount = 0; }
    }
    return str;
}

function mergeLegoRoots(rootA, rootB, meanLen, styleKey) {
    const maxLen = Math.round(meanLen * 1.5);
    let res = applyPhonotactics(rootA, rootB, styleKey);

    if (res.length > maxLen) {
        let cutA = rootA.length > 3 ? rootA.slice(0, Math.ceil(rootA.length / 2)) : rootA;
        res = applyPhonotactics(cutA, rootB, styleKey);
    }
    return res.length > maxLen ? res.slice(0, maxLen) : res;
}

function runPipelineEngine() {
    const meanLen = parseFloat(document.getElementById('mean-length').value);
    const styleKey = document.getElementById('desc').value;
    const socioKey = document.getElementById('socio').value;
    const cultureKey = document.getElementById('culture').value;

    const pData = PHONETICS[styleKey];
    let lexicon = [];

    // Base root generation
    function genRoot(len) {
        let w = "";
        while(w.length < len) {
            w += pData.c[Math.floor(Math.random() * pData.c.length)];
            w += pData.v[Math.floor(Math.random() * pData.v.length)];
        }
        return w.slice(0, len);
    }

    const fireRoot = genRoot(Math.round(meanLen));
    const placeSuffix = genRoot(2); // Short 1-2 char suffix constraint

    lexicon.push({ word: fireRoot, pos: "N", meaning: "fire / heat source [Base Root]" });
    
    // Lego Compound with Sandhi and Length Cut
    const forgeWord = mergeLegoRoots(fireRoot, placeSuffix, meanLen, styleKey);
    lexicon.push({ word: forgeWord, pos: "N", meaning: `forge / volcano [Formula: ${fireRoot} + -${placeSuffix}]` });

    // Sociolinguistic Injection
    if (socioKey === 'hierarchical') {
        const youRoot = genRoot(Math.round(meanLen * 0.8));
        const honorific = genRoot(2);
        const formalYou = applyPhonotactics(youRoot, honorific, styleKey);
        
        lexicon.push({ word: youRoot, pos: "PRON", meaning: "you (informal) [Base Root]" });
        lexicon.push({ word: formalYou, pos: "PRON", meaning: `you (formal) [Formula: ${youRoot} + -${honorific}]` });
    }

    let log = `=== PIPELINE EXECUTION ENGINE COMPLETE ===\n`;
    log += `Applied Phonotactic Rules : Max Consecutive Consonants = ${pData.maxC}, Epenthetic Vowel = '${pData.epenthetic}'\n`;
    log += `Cultural Focus Filter    : ${cultureKey.toUpperCase()}\n`;
    log += `Morphological Constraint  : Max Compound Length = ${Math.round(meanLen * 1.5)} chars\n\n`;
    log += `WORD                   | POS   | MEANING / DERIVATION FORMULA\n`;
    log += `-`.repeat(75) + `\n`;

    lexicon.forEach(e => {
        log += `${e.word.padEnd(22, ' ')} | ${e.pos.padEnd(5, ' ')} | ${e.meaning}\n`;
    });

    document.getElementById('output').innerText = log;
}
</script>

</body>
</html>
