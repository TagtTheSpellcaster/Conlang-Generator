<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Generator</title>
    <link rel="stylesheet" href="vocabulary.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <h1>Conlang Generator <span id="engine-version" class="pill">v0.7.3</span></h1>
            <div id="language-name" class="pills"></div>
        </div>
        <div class="header-actions">
            <button id="open-vocabulary-manager" type="button">Vocabulary Manager</button>
            <button id="export-vocabulary" type="button">Export Vocabulary</button>
            <button id="import-vocabulary" type="button">Import Vocabulary</button>
            <input id="import-vocabulary-file" type="file" accept=".json,application/json" hidden>
        </div>
    </header>

    <main class="app-shell">
        <nav class="tabs" role="tablist" aria-label="Conlang Generator sections">
            <button class="tab active" id="tab-generation" role="tab" aria-selected="true" aria-controls="panel-generation" type="button">Generation</button>
            <button class="tab" id="tab-lexicon" role="tab" aria-selected="false" aria-controls="panel-lexicon" type="button">Generated Lexicon</button>
            <button class="tab" id="tab-dictionary" role="tab" aria-selected="false" aria-controls="panel-dictionary" type="button">Dictionary</button>
        </nav>

        <section id="panel-generation" class="tab-panel active" role="tabpanel" aria-labelledby="tab-generation">
            <div class="generation-grid">
                <section class="card semantic-profile">
                    <h2>Semantic Profile</h2>
                    <div class="form-grid">
                        <label>Region<select id="region"><option value="">Random</option></select></label>
                        <label>Culture<select id="culture"><option value="">Random</option></select></label>
                        <label>Biome<select id="biome"><option value="">Random</option></select></label>
                        <label>Temporal Setting<select id="temporal-setting"><option value="">Random</option></select></label>
                        <label>Lexicon Size<input id="lexicon-size" type="number" min="100" max="2000" value="600"></label>
                    </div>
                </section>

                <div class="generation-middle">
                    <section class="card">
                        <h2>Phonology</h2>
                        <div class="form-grid compact">
                            <label>Consonant Profile<select id="consonant-profile"><option value="">Random</option></select></label>
                            <label>Vowel Profile<select id="vowel-profile"><option value="">Random</option></select></label>
                            <label>Syllable Structure<select id="syllable-structure"><option value="">Random</option></select></label>
                        </div>
                    </section>
                    <section class="card">
                        <h2>Morphosyntax</h2>
                        <div class="form-grid compact">
                            <label>Word Order<select id="word-order"><option value="">Random</option></select></label>
                            <label>Morphological Type<select id="morphological-type"><option value="">Random</option></select></label>
                            <label>Adjective Order<select id="adjective-order"><option value="">Random</option></select></label>
                        </div>
                    </section>
                </div>

                <section class="generation-actions">
                    <button id="generate" class="primary" type="button">Generate Language</button>
                    <button id="regenerate" type="button">Regenerate Lexicon</button>
                    <button id="randomize" type="button">Randomize Parameters</button>
                    <div id="db-status" class="status" aria-live="polite">Loading vocabulary…</div>
                </section>
            </div>
        </section>

        <section id="panel-lexicon" class="tab-panel" role="tabpanel" aria-labelledby="tab-lexicon" hidden>
            <div id="generated-lexicon" class="table-wrap"></div>
        </section>

        <section id="panel-dictionary" class="tab-panel" role="tabpanel" aria-labelledby="tab-dictionary" hidden>
            <div class="dictionary-toolbar">
                <label>Dictionary direction<select id="dictionary-direction"><option value="conlang-en">Conlang → English</option><option value="en-conlang">English → Conlang</option></select></label>
                <input id="dictionary-search" type="search" placeholder="Search…" autocomplete="off">
            </div>
            <div id="dictionary-results" class="table-wrap"></div>
        </section>
    </main>

    <script src="conlang_engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = [...document.querySelectorAll('.tab')];
            const panels = [...document.querySelectorAll('.tab-panel')];

            tabs.forEach(tab => tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    const active = t === tab;
                    t.classList.toggle('active', active);
                    t.setAttribute('aria-selected', String(active));
                });
                panels.forEach(panel => {
                    const active = panel.id === tab.getAttribute('aria-controls');
                    panel.hidden = !active;
                    panel.classList.toggle('active', active);
                });
            }));

            window.addEventListener('conlang:generated', event => {
                const lexicon = event.detail?.lexicon || [];
                const target = document.getElementById('generated-lexicon');
                if (!target) return;
                target.innerHTML = lexicon.map((entry, index) => `
                    <div class="lexicon-row"><span>${index + 1}</span><strong>${entry.word ?? ''}</strong><span>${entry.concept ?? entry.english ?? ''}</span></div>
                `).join('');
            });
        });
    </script>
</body>
</html>
