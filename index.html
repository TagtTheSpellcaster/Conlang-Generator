<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Generator Studio v2.3.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-sky-500 selection:text-white">

    <!-- Header Section -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-md shadow-sky-500/20">
                C
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    Conlang Generator Studio
                    <span id="conlang-title-badge" class="text-xs bg-sky-950 text-sky-400 border border-sky-800/60 px-2.5 py-0.5 rounded-full font-medium">Language: Unnamed</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center space-x-3 mt-2 sm:mt-0">
            <span class="text-xs font-mono bg-slate-800 text-slate-400 px-2.5 py-1 rounded border border-slate-700">v2.3.0</span>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden">
        
        <!-- Sidebar Controls Panel -->
        <aside class="w-full lg:w-96 bg-slate-900/90 border-r border-slate-800 p-5 overflow-y-auto flex flex-col space-y-5">
            <button id="quick-generate-btn" class="w-full py-3 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-semibold rounded-lg shadow-lg shadow-emerald-900/20 active:scale-[0.99] transition-all flex items-center justify-center space-x-2">
                <span>⚡ One-Click Generate</span>
            </button>

            <div class="border-t border-slate-800 pt-4 space-y-4">
                <h2 class="text-xs font-semibold text-sky-400 uppercase tracking-wider">Aesthetic & Cultural Settings</h2>
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Aesthetic Profile</label>
                    <select id="descriptive-preset" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition-colors">
                        <option value="musical">Musical / Melodic</option>
                        <option value="dark">Dark / Guttural</option>
                        <option value="magical">Magical / Ethereal</option>
                        <option value="aquatic">Aquatic / Fluid</option>
                        <option value="harsh">Harsh / Rigid</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Cultural & Temporal Setting</label>
                    <select id="cultural-preset" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition-colors">
                        <option value="primitive">Tribal / Primal Era</option>
                        <option value="ancient">Ancient Empire</option>
                        <option value="medieval">Medieval Fantasy</option>
                        <option value="renaissance">Renaissance Guilds</option>
                        <option value="african">Sub-Saharan Nomadic</option>
                        <option value="alien">Extraterrestrial Sci-Fi</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Sociolinguistic Context</label>
                    <select id="sociological-preset" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition-colors">
                        <option value="egalitarian">Tribal / Communal Egalitarianism</option>
                        <option value="hierarchical">Hierarchical Feudal Imperial</option>
                        <option value="mercantile">Mercantile Trade Guild</option>
                        <option value="monastic">Isolationist Monastic Order</option>
                    </select>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-4 space-y-4">
                <h2 class="text-xs font-semibold text-sky-400 uppercase tracking-wider">Phonology & Syllable Rules</h2>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Mean Syllables</label>
                        <input type="number" id="mean-length" value="2.5" step="0.1" min="1.0" max="4.5" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Std Deviation</label>
                        <input type="number" id="std-dev" value="0.8" step="0.1" min="0.1" max="2.0" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Vowel Inventory</label>
                    <select id="vowel-inventory" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="standard">Standard (a, e, i, o, u)</option>
                        <option value="minimal">Minimalist (a, i, u)</option>
                        <option value="extended">Extended (a, e, i, o, u, y, ø, æ)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Consonant Density</label>
                    <select id="consonant-inventory" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="balanced">Balanced (Plosives, Nasals, Fricatives)</option>
                        <option value="guttural">Guttural Heavy (Velar, Uvular Focus)</option>
                        <option value="sibilant">Sibilant & Liquid Heavy (s, z, sh, r, l)</option>
                        <option value="soft">Soft Approximant (m, n, l, r, w, j)</option>
                    </select>
                </div>
            </div>

            <div class="border-t border-slate-800 pt-4 space-y-4">
                <h2 class="text-xs font-semibold text-sky-400 uppercase tracking-wider">Morphosyntax & Typology</h2>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Morphological Strategy</label>
                    <select id="morphology-type" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="agglutinative">Agglutinative (Affix Stacking)</option>
                        <option value="isolating">Isolating / Fusional (Stem Preservation)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Grammatical Relations Strategy</label>
                    <select id="grammar-strategy" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="cases">Inflectional Case Endings</option>
                        <option value="prepositions">Prepositional / Word-Order Based</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Article System</label>
                    <select id="article-mode" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="both">Definite & Indefinite</option>
                        <option value="definite_only">Definite Only</option>
                        <option value="indefinite_only">Indefinite Only</option>
                        <option value="partitive">Definite, Indefinite & Partitive</option>
                        <option value="none">Zero Articles (No Articles)</option>
                    </select>
                </div>
            </div>

            <button id="custom-generate-btn" class="w-full py-2.5 px-4 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-lg shadow-md shadow-sky-900/30 transition-all text-sm">
                Generate Custom Conlang
            </button>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col bg-slate-950 p-6 overflow-y-auto">
            
            <!-- Tab Navigation Header & Export Toolbar -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b border-slate-800">
                <nav class="flex space-x-1 bg-slate-900 p-1 rounded-lg border border-slate-800">
                    <button class="tab-btn px-4 py-2 text-xs font-semibold rounded-md text-sky-400 bg-slate-800 shadow transition-all" data-tab="tab-grammar">Grammar Profile</button>
                    <button class="tab-btn px-4 py-2 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition-all" data-tab="tab-words">Vocabulary (600)</button>
                    <button class="tab-btn px-4 py-2 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition-all" data-tab="tab-sentences">Sentences (100)</button>
                    <button class="tab-btn px-4 py-2 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition-all" data-tab="tab-dialogues">Dialogues (20)</button>
                </nav>

                <div class="flex space-x-2">
                    <button id="export-json-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition-all flex items-center space-x-1.5">
                        <span>📥 Export JSON</span>
                    </button>
                    <button id="copy-json-btn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg border border-slate-700 transition-all flex items-center space-x-1.5">
                        <span>📋 Copy JSON</span>
                    </button>
                </div>
            </div>

            <!-- Tab Content View: Grammar Profile -->
            <div id="tab-grammar" class="tab-content block space-y-6">
                <div id="grammar-container"></div>
            </div>

            <!-- Tab Content View: Vocabulary -->
            <div id="tab-words" class="tab-content hidden space-y-4">
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="vocab-search" placeholder="Search lexemes or translations..." class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                    <select id="pos-filter" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="all">All Categories</option>
                        <option value="Article">Articles</option>
                        <option value="Case Suffix">Case Suffixes</option>
                        <option value="Pronoun">Pronouns</option>
                        <option value="Possessive">Possessives</option>
                        <option value="Grammatical Word">Grammatical Words</option>
                        <option value="Noun">Nouns</option>
                        <option value="Verb">Verbs</option>
                        <option value="Adjective">Adjectives</option>
                    </select>
                </div>
                <div id="words-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
            </div>

            <!-- Tab Content View: Sentences -->
            <div id="tab-sentences" class="tab-content hidden space-y-4">
                <div id="sentences-container" class="space-y-4"></div>
            </div>

            <!-- Tab Content View: Dialogues -->
            <div id="tab-dialogues" class="tab-content hidden space-y-4">
                <div id="dialogues-container" class="space-y-4"></div>
            </div>

        </main>
    </div>

    <!-- External JavaScript Engine Logic -->
    <script src="conlang_engine.js"></script>
</body>
</html>
