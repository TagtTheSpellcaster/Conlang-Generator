<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Engine v3.0.0</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 1100px; width: 100%; }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .header-title h1 { margin: 0; }
        .version-badge {
            background-color: var(--accent);
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            box-sizing: border-box;
        }

        button.primary-btn {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button.primary-btn:hover { background-color: var(--accent-hover); }

        button.export-btn {
            background-color: var(--btn-green);
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button.export-btn:hover { background-color: var(--btn-green-hover); }

        .output-box {
            background-color: #020617;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px;
            white-space: pre-wrap;
            font-family: "Cascadia Code", "Courier New", Courier, monospace;
            font-size: 0.85rem;
            max-height: 600px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .actions-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <h1>Advanced Conlang Engine</h1>
        <span class="version-badge">v3.0.0</span>
    </div>

    <div class="card">
        <button class="primary-btn" onclick="generateRandomConlang()">⚡ One-Click Quick Generation</button>
    </div>

    <div class="card">
        <h3>Configuration Parameters</h3>
        <div class="grid">
            <div>
                <label for="mean-length">Mean Word Length (Chars)</label>

            </div>
            <div>
                <label for="std-dev">Std Deviation (Gaussian)</label>
                <input type="number" id="std-dev" value="1.2" min="0.2" max="3.0" step="0.1">
            </div>
            <div>
                <label for="desc">Phonotactic Style</label>
                <select id="desc">
                    <option value="harsh">Harsh / Imperial (Heavy Clusters)</option>
                    <option value="musical">Musical / Flowing (Strict CV)</option>
                    <option value="dark">Dark / Guttural (Clusters CCV)</option>
                    <option value="magic">Magical / Ethereal</option>
                    <option value="aquatic">Aquatic / Fluid</option>
                    <option value="none">Balanced / Natural</option>
                </select>
            </div>
            <div>
                <label for="socio">Sociolinguistic Structure</label>
                <select id="socio">
                    <option value="hierarchical">Hierarchical (Strict Honorifics)</option>
                    <option value="egalitarian">Egalitarian (No Honorifics)</option>
                    <option value="caste">Caste / Secret (Taboo Markers)</option>
                </select>
            </div>
            <div>
                <label for="culture">Socio-Temporal Setting</label>

                    <option value="ancient">Ancient / Archaic (SOV)</option>

                    <option value="medieval">Medieval / Nomadic (SVO)</option>
                    <option value="alien">Alien / Non-Human (OVS)</option>

            </div>
        </div>

        <br>

        <div class="grid">
            <div>
                <label for="custom-vowels">Custom Vowels (comma separated)</label>
                <input type="text" id="custom-vowels" placeholder="a, e, i, o, u">
            </div>
            <div>
                <label for="custom-cons">Custom Consonants (comma separated)</label>
                <input type="text" id="custom-cons" placeholder="p, t, k, m, n, s, r, l">
            </div>
        </div>

        <br>
        <button class="primary-btn" onclick="generateCustomConlang()">Generate Full Pocket Phrasebook System (550+ Terms)</button>
    </div>

    <div class="card">
        <h3>Generated Engine Output & Pocket Phrasebook</h3>
        <div id="output" class="output-box">Select parameters and click generate...</div>
        
        <div class="actions-group">
            <button class="export-btn" onclick="exportJSON()">📥 Export Conlang Data (JSON)</button>
            <button class="export-btn" onclick="exportCSV()">📥 Export Dictionary (CSV)</button>
        </div>
    </div>
</div>

<script>

const PHRASE_DATA = {
    primitive: [
        { en: "Where is the water spring?", pattern: "Q_SPRING_BE_WHERE" },
        { en: "The predator beast is near.", pattern: "BEAST_NEAR_BE" },
        { en: "I offer this meat.", pattern: "I_OFFER_MEAT" },

    ],
    medieval: [

        { en: "How much is this horse?", pattern: "Q_COST_HORSE" },

    ],
    renaissance: [
        { en: "Where is the academy located?", pattern: "Q_WHERE_BE_ACADEMY" },
        { en: "Show me the city map.", pattern: "YOU_SHOW_MAP" },
        { en: "I seek the city physician.", pattern: "I_SEEK_PHYSICIAN" },
        { en: "I am a scholar of astronomy.", pattern: "I_BE_SCHOLAR" },
        { en: "Where can I buy printed books?", pattern: "Q_WHERE_BUY_BOOKS" },
        { en: "I bring news from the capital.", pattern: "I_BRING_NEWS" },
        { en: "This formula is not correct.", pattern: "FORMULA_NOT_GOOD" },
        { en: "I seek safe passage to the university.", pattern: "I_SEEK_ROAD" }
    ],
    ancient: [
        { en: "Where is the sacred temple?", pattern: "Q_WHERE_BE_TEMPLE" },
        { en: "I bring tribute to the king.", pattern: "I_BRING_TRIBUTE" },
        { en: "We offer this bronze vessel.", pattern: "WE_OFFER_BRONZE" },
        { en: "Are you a priest of the gods?", pattern: "Q_YOU_BE_PRIEST" },
        { en: "Show me the royal decrees.", pattern: "YOU_SHOW_DECREE" },
        { en: "The city walls are strong.", pattern: "WALLS_STRONG_BE" },
        { en: "I do not speak your tongue.", pattern: "I_NOT_SPEAK_TONGUE" },
        { en: "Lead us to the marketplace.", pattern: "LEAD_US_MARKET" }
    ],
    alien: [
        { en: "Where is the plasma energy source?", pattern: "Q_WHERE_BE_PLASMA" },
        { en: "We seek mental connection.", pattern: "WE_SEEK_MIND" },
        { en: "Identify your neural frequency.", pattern: "YOU_SHOW_FREQ" },
        { en: "Our vessel comes in harmony.", pattern: "VESSEL_PEACE_BE" },
        { en: "Do you absorb solar radiation?", pattern: "Q_YOU_ABSORB_LIGHT" },
        { en: "Gravity fluctuation is near.", pattern: "GRAVITY_NEAR_BE" },
        { en: "I do not parse your signal.", pattern: "I_NOT_KNOW_SIGNAL" },
        { en: "Show us the planetary core map.", pattern: "YOU_SHOW_CORE" }
    ]
};

let currentConlangData = null;

function isVowel(ch) { return ['a', 'e', 'i', 'o', 'u', 'y'].includes(ch.toLowerCase()); }

function getGaussianLength(mean, stdDev) {
    let u1 = 0, u2 = 0;
    while (u1 === 0) u1 = Math.random();
    while (u2 === 0) u2 = Math.random();
    let z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
    let len = Math.round(mean + z0 * stdDev);
    return Math.max(2, Math.min(15, len));
}

function applyPhonotactics(partA, partB, styleKey, customRules = null) {
    const rules = customRules || PHONETICS[styleKey] || PHONETICS.none;
    let overlapLen = Math.min(partA.length, partB.length);
    for (let len = overlapLen; len >= 1; len--) {
        let suffixA = partA.slice(-len);
        let prefixB = partB.slice(0, len);
        if (suffixA.toLowerCase() === prefixB.toLowerCase()) {
            partA = partA.slice(0, -len);
            break;
        }
    }
    let str = partA + partB;
    if (isVowel(partA.slice(-1)) && isVowel(partB.charAt(0)) && partA.slice(-1) === partB.charAt(0)) {
        str = partA.slice(0, -1) + partB;
    }
    let cCount = 0;
    for (let i = 0; i < str.length; i++) {
        if (!isVowel(str[i])) {
            cCount++;
            if (cCount > rules.maxC) {
                str = str.slice(0, i) + rules.epenthetic + str.slice(i);
                break;
            }
        } else { cCount = 0; }
    }
    return str;
}

function applyExternalSandhi(wordsArray) {
    let resultSentence = [];
    for (let i = 0; i < wordsArray.length; i++) {
        let current = wordsArray[i];
        if (i < wordsArray.length - 1) {
            let next = wordsArray[i + 1];
            if (isVowel(current.slice(-1)) && isVowel(next.charAt(0)) && current.slice(-1) === next.charAt(0)) {
                current = current.slice(0, -1);
            }
        }
        resultSentence.push(current);
    }
    return resultSentence.join(' ');
}

function mergeLegoRoots(rootA, rootB, meanLen, styleKey, customRules = null) {
    const maxLen = Math.round(meanLen * 1.5);
    let res = applyPhonotactics(rootA, rootB, styleKey, customRules);
    if (res.length > maxLen) {
        let cutA = rootA.length > 3 ? rootA.slice(0, Math.ceil(rootA.length / 2)) : rootA;
        res = applyPhonotactics(cutA, rootB, styleKey, customRules);
    }
    return res.length > maxLen ? res.slice(0, maxLen) : res;
}

function buildFullConlangEngine(config) {
    const pData = config.customRules || PHONETICS[config.desc] || PHONETICS.none;
    const v = config.vowels.length ? config.vowels : pData.v;
    const c = config.consonants.length ? config.consonants : pData.c;

    let wordOrder = 'SVO';
    if (config.culture === 'ancient' || config.culture === 'primitive') wordOrder = 'SOV';
    if (config.culture === 'alien') wordOrder = 'OVS';

    let lexicon = [];
    let usedWords = new Set();
    let roots = {};

    function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    function makeRoot(targetLen) {
        let w = "";
        let attempts = 0;
        do {
            w = "";
            while(w.length < targetLen) {
                w += getRandom(c);
                w += getRandom(v);
            }
            w = w.slice(0, targetLen);
            attempts++;
        } while (usedWords.has(w) && attempts < 50);
        usedWords.add(w);
        return w;
    }

    // Roots
    CORE_GRAMMAR.forEach(item => { let w = makeRoot(getGaussianLength(config.meanLength, config.stdDev)); roots[item.id] = w; lexicon.push({ word: w, pos: item.pos, category: "Grammar", meaning: item.concept }); });
    CORE_VERBS.forEach(item => { let w = makeRoot(getGaussianLength(config.meanLength, config.stdDev)); roots[item.id] = w; lexicon.push({ word: w, pos: item.pos, category: "Base Verb", meaning: item.concept }); });
    CORE_NOUNS.forEach(item => { let w = makeRoot(getGaussianLength(config.meanLength, config.stdDev)); roots[item.id] = w; lexicon.push({ word: w, pos: item.pos, category: "Base Noun", meaning: item.concept }); });
    CORE_ADJECTIVES.forEach(item => { let w = makeRoot(getGaussianLength(config.meanLength, config.stdDev)); roots[item.id] = w; lexicon.push({ word: w, pos: item.pos, category: "Base Adjective", meaning: item.concept }); });

    // Rules
    const pluralSuffix = makeRoot(2);
    const adjPosition = config.culture === 'primitive' || config.culture === 'ancient' ? 'BEFORE' : 'AFTER';
    const adjAgreement = config.socio === 'hierarchical' ? 'AGREES (plural suffix)' : 'INVARIANT';
    const negParticle = roots["not"] || makeRoot(2);
    const pastPart = roots["past"] || makeRoot(2);
    const quesPart = roots["ques"] || makeRoot(2);

    const systemicGrammarRules = {
        pluralRule: `Nouns form plural by adding '-${pluralSuffix}'.`,
        nounPhraseRule: `Adjectives are placed ${adjPosition} the noun. Adjectives are ${adjAgreement}.`,
        verbInflectionRule: `Tense markers are isolated particles. Past: '${pastPart}' IMMEDIATELY BEFORE verb.`,
        complexSyntaxRule: `Canonical Order: ${wordOrder}. Negation '${negParticle}' stands IMMEDIATELY BEFORE verb. Question particle '${quesPart}' stands at the VERY START of interrogative sentences.`
    };

    // Expand Dictionary up to 550+ entries
    let dynamicIdx = 1;
    let domainTags = ["Domain_Nature", "Domain_Society", "Domain_Science", "Domain_Military", "Domain_Trade"];
    let baseKeys = Object.keys(roots);
    while (lexicon.length < 550) {
        let k1 = getRandom(baseKeys);
        let k2 = getRandom(baseKeys);
        if (k1 !== k2) {
            let comp = mergeLegoRoots(roots[k1], roots[k2], config.meanLength, config.desc, pData);
            if (!usedWords.has(comp)) {
                usedWords.add(comp);
                lexicon.push({
                    word: comp,
                    pos: getRandom(["N", "V", "ADJ"]),
                    category: getRandom(domainTags),
                    meaning: `expanded vocabulary term #${dynamicIdx++} [${roots[k1]} + ${roots[k2]}]`
                });
            }
        }
    }

    let honorificSuffix = "";
    if (config.socio === 'hierarchical') {
        let youBase = lexicon.find(l => l.meaning.includes("you (2nd person sing. informal)"));
        if (youBase) {
            honorificSuffix = makeRoot(2);
            let formalYou = applyPhonotactics(youBase.word, honorificSuffix, config.desc, pData);
            lexicon.push({ word: formalYou, pos: "PRON", category: "Sociolinguistic", meaning: `you (formal / honorific) [${youBase.word} + -${honorificSuffix}]` });
        }
    }

    // --- GENERAZIONE FRASI SURVIVAL ADATTATE (8 ESSENZIALI) ---
    const culturePhrasesRaw = PHRASE_DATA[config.culture] || PHRASE_DATA.renaissance;
    let survivalPhrasesOutput = [];

    culturePhrasesRaw.forEach((item, idx) => {
        let subject = roots["i"] || "i";
        let verb = roots["see"] || "see";
        let object = roots["water"] || "water";
        let questionPrefix = quesPart;
        let isQ = item.pattern.startsWith("Q_");

        if (config.socio === 'hierarchical' && item.en.toLowerCase().includes("you")) {
            subject = applyPhonotactics(roots["you"] || "you", honorificSuffix, config.desc, pData);
        }

        let words = [];
        let structStr = "";

        if (wordOrder === 'SVO') {
            words = [subject, verb, object];
            structStr = "Subject -> Verb -> Object";
        } else if (wordOrder === 'SOV') {
            words = [subject, object, verb];
            structStr = "Subject -> Object -> Verb";
        } else if (wordOrder === 'OVS') {
            words = [object, verb, subject];
            structStr = "Object -> Verb -> Subject";
        }

        if (isQ) {
            words.unshift(questionPrefix);
            structStr = "QuestionPart -> " + structStr;
        }

        let conlangText = applyExternalSandhi(words);
        survivalPhrasesOutput.push({
            num: idx + 1,
            en: item.en,
            structure: structStr,
            conlang: conlangText
        });
    });

    // --- SECTION A: 35 CULTURAL SURVIVAL PHRASES (5 BLOCKS) ---
    const blocksData = [
        { name: "Block 1: Greetings, Identity & Courtesy", topics: ["I am a traveler", "We come in peace", "Greetings to the chief", "I bring good gifts", "My name is recorded", "We seek safe shelter", "Honor to your hall"] },
        { name: "Block 2: Orientation & Places", topics: ["Where is the city gate?", "Show me the road", "Is the academy near?", "Where is the clean spring?", "We seek the main market", "The path is dangerous", "Where do horses rest?"] },
        { name: "Block 3: Needs & Survival", topics: ["I need fresh water", "We offer cooked food", "Where is the physician?", "I am wounded and cold", "Do you have medicine?", "We seek shelter from storm", "Give us fire light"] },
        { name: "Block 4: Trade & Tributes", topics: ["How much for this book?", "I offer this forged metal", "We pay the required tribute", "Will you trade for meat?", "This coin is valid", "I buy this map", "We trade in peace"] },
        { name: "Block 5: Danger & Alarms", topics: ["Fire is near the wall!", "The predator beast approaches", "I do not know your tongue", "Enemy forces are close", "Flee to the mountains!", "Stop and identify yourself", "The storm is arriving"] }
    ];

    let section35Phrases = [];
    let p35Count = 1;
    blocksData.forEach(block => {
        let blockItems = [];
        block.topics.forEach(top => {
            let w1 = quesPart;
            let w2 = roots["i"] || "i";
            let w3 = roots["go"] || "go";
            let w4 = roots["city"] || "city";
            let phrWords = (wordOrder === 'SOV') ? [w2, w4, w3] : [w2, w3, w4];
            if (top.includes("?")) phrWords.unshift(w1);
            blockItems.push({
                num: p35Count++,
                en: top,
                conlang: applyExternalSandhi(phrWords)
            });
        });
        section35Phrases.push({ blockName: block.name, items: blockItems });
    });

    // --- SECTION B: 20 MINI-DIALOGUES (4-WAY INTERACTIONS) ---
    let dialoguesOutput = [];
    const dialogueTitles = [
        "At the City Gate", "Trader and Scholar", "In the Hall of Knowledge", "Meeting the Local Leader",
        "Asking for Directions", "At the Forge Market", "In the Tavern/Shelter", "With the Local Physician",
        "Tribute Inspection", "Night Watch Encounter", "Buying a Map", "Discussing Weather Storm",
        "Exchanging Remedies", "At the Horse Stables", "Encounter in the Forest", "With the Temple Priest",
        "Trading Forged Tools", "Reporting Enemy Sighting", "In the Alchemy Workshop", "Parting Blessing"
    ];

    for (let d = 1; d <= 20; d++) {
        let pA = roots["i"] || "i";
        let pB = (config.socio === 'hierarchical') ? applyPhonotactics(roots["you"] || "you", honorificSuffix, config.desc, pData) : (roots["you"] || "you");
        let v1 = roots["see"] || "see";
        let v2 = roots["know"] || "know";
        let n1 = roots["road"] || "road";

        let lineA1 = applyExternalSandhi([quesPart, pA, v1, pB]);
        let lineB1 = applyExternalSandhi([pB, v2, pA]);
        let lineA2 = applyExternalSandhi([pA, roots["want"] || "want", n1]);
        let lineB2 = applyExternalSandhi([pB, roots["give"] || "give", n1]);

        dialoguesOutput.push({
            id: d,
            title: dialogueTitles[d - 1] || `Interaction #${d}`,
            a1En: "Do I see you in peace?", a1Con: lineA1,
            b1En: "I know your presence.", b1Con: lineB1,
            a2En: "I seek the way to the hall.", a2Con: lineA2,
            b2En: "I offer you the path.", b2Con: lineB2
        });
    }

    currentConlangData = {
        metadata: config,
        version: "v3.0.0",
        grammarRules: systemicGrammarRules,
        lexicon: lexicon,
        essentialPhrases: survivalPhrasesOutput,
        sectionA35: section35Phrases,
        sectionB20: dialoguesOutput
    };

    // Logging Output
    let text = `=== CONLANG ENGINE v3.0.0 POCKET PHRASEBOOK LOG ===\n`;
    text += `Target Mean Word Length: ${config.meanLength} (Std Dev: ${config.stdDev})\n`;
    text += `Total Generated Vocabulary: ${lexicon.length} Terms (Extended Phrasebook Matrix)\n`;
    text += `Canonical Word Order    : ${wordOrder}\n`;
    text += `Sociolinguistic Mode    : ${config.socio.toUpperCase()}\n\n`;

    text += `=== SYSTEMIC GRAMMAR RULES ===\n`;
    text += `A) Plural Formation        : ${systemicGrammarRules.pluralRule}\n`;
    text += `B) Noun Phrase Structure   : ${systemicGrammarRules.nounPhraseRule}\n`;
    text += `C) Verb Inflection Mechanism: ${systemicGrammarRules.verbInflectionRule}\n`;
    text += `D) Complex Syntax & Questions: ${systemicGrammarRules.complexSyntaxRule}\n\n`;

    text += `=== CULTURAL SURVIVAL PHRASES (ESSENTIAL 8) ===\n`;
    survivalPhrasesOutput.forEach(p => {
        text += `${p.num}. English: "${p.en}"\n   ConLang Structure: [${p.structure}]\n   ConLang Text     : ${p.conlang}\n\n`;
    });

    text += `=== SECTION A: 35 CULTURAL SURVIVAL PHRASES ===\n`;
    section35Phrases.forEach(b => {
        text += `\n--- ${b.blockName} ---\n`;
        b.items.forEach(item => {
            text += `${item.num}. EN: "${item.en}" | CONLANG: ${item.conlang}\n`;
        });
    });

    text += `\n\n=== SECTION B: 20 MINI-DIALOGUES (4-Way Interactions) ===\n`;
    dialoguesOutput.forEach(d => {
        text += `\nDialogue ${d.id}: [${d.title}]\n`;
        text += `A1: EN: "${d.a1En}" | CONLANG: "${d.a1Con}"\n`;
        text += `B1: EN: "${d.b1En}" | CONLANG: "${d.b1Con}"\n`;
        text += `A2: EN: "${d.a2En}" | CONLANG: "${d.a2Con}"\n`;
        text += `B2: EN: "${d.b2En}" | CONLANG: "${d.b2Con}"\n`;
    });

    text += `\n\n=== FULL DICTIONARY EXCERPT (${lexicon.length} Entries) ===\n`;
    text += `${"WORD".padEnd(20, ' ')} | ${"POS".padEnd(6, ' ')} | ${"CATEGORY".padEnd(20, ' ')} | MEANING / FORMULA\n`;
    text += `-`.repeat(85) + `\n`;

    lexicon.slice(0, 100).forEach(entry => {
        text += `${entry.word.padEnd(20, ' ')} | ${entry.pos.padEnd(6, ' ')} | ${entry.category.padEnd(20, ' ')} | ${entry.meaning}\n`;
    });
    text += `... [${lexicon.length - 100} additional terms included in export JSON/CSV]\n`;

    return text;
}

function generateRandomConlang() {
    const descs = ['harsh', 'musical', 'dark', 'magic', 'aquatic', 'none'];
    const socios = ['hierarchical', 'egalitarian', 'caste'];
    const cultures = ['renaissance', 'ancient', 'primitive', 'medieval', 'alien'];

    const config = {
        meanLength: (Math.random() * 3 + 4).toFixed(1),
        stdDev: (Math.random() * 1.0 + 0.8).toFixed(1),
        vowels: [],
        consonants: [],
        desc: descs[Math.floor(Math.random() * descs.length)],
        socio: socios[Math.floor(Math.random() * socios.length)],
        culture: cultures[Math.floor(Math.random() * cultures.length)]
    };

    document.getElementById('mean-length').value = config.meanLength;
    document.getElementById('std-dev').value = config.stdDev;
    document.getElementById('desc').value = config.desc;
    document.getElementById('socio').value = config.socio;
    document.getElementById('culture').value = config.culture;

    document.getElementById('output').innerText = buildFullConlangEngine(config);
}

function generateCustomConlang() {
    const vInput = document.getElementById('custom-vowels').value;
    const cInput = document.getElementById('custom-cons').value;

    const config = {
        meanLength: parseFloat(document.getElementById('mean-length').value),
        stdDev: parseFloat(document.getElementById('std-dev').value),
        vowels: vInput ? vInput.split(',').map(s => s.trim()) : [],
        consonants: cInput ? cInput.split(',').map(s => s.trim()) : [],
        desc: document.getElementById('desc').value,
        socio: document.getElementById('socio').value,
        culture: document.getElementById('culture').value
    };

    document.getElementById('output').innerText = buildFullConlangEngine(config);
}

function exportJSON() {
    if (!currentConlangData) return alert("Error: Generate a conlang first.");
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentConlangData, null, 2));
    const btn = document.createElement('a');
    btn.setAttribute("href", dataStr);
    btn.setAttribute("download", `conlang_v3.0.0_phrasebook.json`);
    document.body.appendChild(btn);
    btn.click();
    btn.remove();
}

function exportCSV() {
    if (!currentConlangData) return alert("Error: Generate a conlang first.");
    let csvContent = "data:text/csv;charset=utf-8,Word,POS,Category,Meaning\n";
    currentConlangData.lexicon.forEach(item => {
        csvContent += `"${item.word}","${item.pos}","${item.category}","${item.meaning}"\n`;
    });
    const btn = document.createElement("a");
    btn.setAttribute("href", encodeURI(csvContent));
    btn.setAttribute("download", `conlang_dictionary_550.csv`);
    document.body.appendChild(btn);
    btn.click();
    btn.remove();
}
</script>
