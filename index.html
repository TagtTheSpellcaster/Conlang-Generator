<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Engine - Morphological & Statistical Generator</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1050px;
            width: 100%;
        }

        h1, h3 { color: #f8fafc; margin-top: 0; }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        select, input, button {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            box-sizing: border-box;
        }

        button.primary-btn {
            background-color: var(--accent);
            color: #ffffff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button.primary-btn:hover { background-color: var(--accent-hover); }

        button.export-btn {
            background-color: var(--btn-green);
            color: #ffffff;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button.export-btn:hover { background-color: var(--btn-green-hover); }

        .output-box {
            background-color: #020617;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 15px;
            white-space: pre-wrap;
            font-family: "Cascadia Code", "Courier New", Courier, monospace;
            font-size: 0.88rem;
            max-height: 550px;
            overflow-y: auto;
            line-height: 1.5;
        }

        .actions-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Generatore Avanzato di Conlang con Controllo Statistico</h1>

    <div class="card">
        <button class="primary-btn" onclick="generateRandomConlang()">⚡ Generazione Rapida (Parametri Casuali)</button>
    </div>

    <div class="card">
        <h3>Parametri Statistico-Morfologici e Socio-Culturali</h3>
        
        <div class="grid">
            <div>
                <label for="mean-length">Lunghezza Media Parole (Caratteri)</label>
                <input type="number" id="mean-length" value="5" min="2" max="12" step="0.5">
            </div>
            <div>
                <label for="std-dev">Deviazione Standard (Variabilità)</label>
                <input type="number" id="std-dev" value="1.2" min="0.0" max="4.0" step="0.1">
            </div>
            <div>
                <label for="desc">Stile Estetico</label>
                <select id="desc">
                    <option value="none">Bilanciato / Naturale</option>
                    <option value="musical">Musicale / Flautata</option>
                    <option value="dark">Oscura / Cavernosa</option>
                    <option value="magic">Magica / Eterea</option>
                    <option value="harsh">Dura / Imperiale</option>
                    <option value="aquatic">Acquatica / Fluidica</option>
                </select>
            </div>
        </div>

        <br>

        <div class="grid">
            <div>
                <label for="socio">Assetto Sociolinguistico</label>
                <select id="socio">
                    <option value="egalitarian">Egalitaria</option>
                    <option value="hierarchical">Gerarchica / Feudale</option>
                    <option value="caste">Castale / Segreta</option>
                </select>
            </div>
            <div>
                <label for="culture">Ambiente Socio-Temporale</label>
                <select id="culture">
                    <option value="primitive">Cultura Primitiva / Tribale</option>
                    <option value="ancient">Cultura Antica / Arcaica</option>
                    <option value="medieval">Cultura Medievale / Nomadica</option>
                    <option value="renaissance">Cultura Rinascimentale / Erudita</option>
                    <option value="alien">Cultura Extraterrestre / Non-Umana</option>
                </select>
            </div>
        </div>

        <br>

        <div class="grid">
            <div>
                <label for="custom-vowels">Vocali Personalizzate</label>
                <input type="text" id="custom-vowels" placeholder="a, e, i, o, u">
            </div>
            <div>
                <label for="custom-cons">Consonanti Personalizzate</label>
                <input type="text" id="custom-cons" placeholder="p, t, k, m, n, s, r, l">
            </div>
        </div>

        <br>
        <button class="primary-btn" onclick="generateCustomConlang()">Genera Vocabolario Esteso Completo</button>
    </div>

    <div class="card">
        <h3>Specifiche e Dizionario Generato</h3>
        <div id="output" class="output-box">Configura i parametri per generare la lingua...</div>
        
        <div class="actions-group">
            <button class="export-btn" onclick="exportJSON()">📥 Esporta Dizionario (JSON)</button>
            <button class="export-btn" onclick="exportCSV()">📥 Esporta Dizionario (CSV)</button>
        </div>
    </div>
</div>

<script>
// --- DATABASES & VOCABULARY STRUCTURE ---
const GRAMMAR_PRIMITIVES = [
    { id: "p_io", concept: "io (1a pers. sing.)", pos: "PRON" },
    { id: "p_tu", concept: "tu (2a pers. sing.)", pos: "PRON" },
    { id: "p_egli", concept: "egli/ella (3a pers. sing.)", pos: "PRON" },
    { id: "p_noi", concept: "noi (1a pers. plur.)", pos: "PRON" },
    { id: "p_voi", concept: "voi (2a pers. plur.)", pos: "PRON" },
    { id: "p_essi", concept: "essi/esse (3a pers. plur.)", pos: "PRON" },
    { id: "d_questo", concept: "questo/questa", pos: "DET" },
    { id: "d_quello", concept: "quello/quella", pos: "DET" },
    { id: "pr_in", concept: "in / dentro", pos: "PREP" },
    { id: "pr_su", concept: "su / sopra", pos: "PREP" },
    { id: "pr_con", concept: "con / insieme a", pos: "PREP" },
    { id: "pr_da", concept: "da / provenienza", pos: "PREP" },
    { id: "cj_e", concept: "e / coordinazione", pos: "CONJ" },
    { id: "cj_ma", concept: "ma / opposizione", pos: "CONJ" },
    { id: "cj_se", concept: "se / ipotesi", pos: "CONJ" },
    { id: "part_neg", concept: "non / negazione", pos: "PART" },
    { id: "part_past", concept: "marcatore di tempo passato", pos: "PART" },
    { id: "part_fut", concept: "marcatore di tempo futuro", pos: "PART" }
];

const VERBS_PRIMITIVES = [
    { id: "v_essere", concept: "essere / esistere", pos: "V" },
    { id: "v_avere", concept: "avere / possedere", pos: "V" },
    { id: "v_fare", concept: "fare / produrre / agire", pos: "V" },
    { id: "v_andare", concept: "andare / camminare / viaggiare (movimento)", pos: "V" },
    { id: "v_vedere", concept: "vedere / percepire", pos: "V" },
    { id: "v_volere", concept: "volere / desiderare", pos: "V" },
    { id: "v_parlare", concept: "parlare / comunicare", pos: "V" },
    { id: "v_mangiare", concept: "mangiare / nutrirsi", pos: "V" },
    { id: "v_bere", concept: "bere / assorbire", pos: "V" },
    { id: "v_dormire", concept: "dormire / riposare", pos: "V" },
    { id: "v_dare", concept: "dare / offrire", pos: "V" },
    { id: "v_prendere", concept: "prendere / afferrare", pos: "V" },
    { id: "v_cadere", concept: "cadere / scendere rapidamente", pos: "V" }
];

const NOUNS_PRIMITIVES = [
    { id: "n_terra", concept: "terra / suolo", pos: "N" },
    { id: "n_cielo", concept: "cielo / volta celeste", pos: "N" },
    { id: "n_fuoco", concept: "fuoco / calore primario", pos: "N" },
    { id: "n_acqua", concept: "acqua / liquido / fiume", pos: "N (Polisemico)" },
    { id: "n_luce", concept: "luce / sole / giorno", pos: "N (Polisemico)" },
    { id: "n_albero", concept: "albero / pianta / legno", pos: "N" },
    { id: "n_capo", concept: "capo / testa / cima", pos: "N" },
    { id: "n_mano", concept: "mano / arto / presa", pos: "N" },
    { id: "n_cuore", concept: "cuore / centro / focolare", pos: "N" },
    { id: "n_occhio", concept: "occhio / organo della vista", pos: "N" },
    { id: "n_persona", concept: "persona / essere umano", pos: "N" },
    { id: "n_casa", concept: "casa / rifugio / dimora", pos: "N" },
    { id: "n_tempo", concept: "tempo / durata / ciclo", pos: "N" },
    { id: "n_vita", concept: "vita / soffio vitale", pos: "N" },
    { id: "n_pane", concept: "cibo base / pane / nutrimento", pos: "N" },
    { id: "n_libro", concept: "sapere inciso / libro / registro", pos: "N" },
    { id: "n_medicina", concept: "cura / medicina / sostanza benefica", pos: "N" },
    { id: "n_montagna", concept: "montagna / rilievo elevato", pos: "N" }
];

const ADJECTIVES_BASE = [
    { id: "a_buono", concept: "buono / valido / favorevole", pos: "ADJ" },
    { id: "a_grande", concept: "grande / ampio", pos: "ADJ" },
    { id: "a_caldo", concept: "caldo / temperatura elevata", pos: "ADJ" },
    { id: "a_nuovo", concept: "nuovo / recente", pos: "ADJ" },
    { id: "a_veloce", concept: "veloce / rapido", pos: "ADJ" }
];

const PHONETIC_PROFILES = {
    none: { v: ['a', 'e', 'i', 'o', 'u'], c: ['p', 't', 'k', 'b', 'd', 'g', 'm', 'n', 's', 'r', 'l'], syll: ['CV', 'CVC'] },
    musical: { v: ['a', 'e', 'i', 'ia', 'ea'], c: ['l', 'r', 'm', 'n', 'v', 's', 'j'], syll: ['CV', 'V'] },
    dark: { v: ['u', 'o', 'y'], c: ['k', 'g', 'q', 'x', 'z', 'r', 'kh'], syll: ['CVC', 'CCV'] },
    magic: { v: ['a', 'i', 'e', 'ae'], c: ['s', 'sh', 'h', 'f', 'l', 'm', 'th'], syll: ['CV', 'CVC'] },
    harsh: { v: ['a', 'u'], c: ['p', 't', 'k', 'ts', 'tr', 'gr', 'kr'], syll: ['CCVC', 'CVCC'] },
    aquatic: { v: ['a', 'i', 'u', 'o'], c: ['m', 'n', 'l', 'w', 'f', 'v', 'bh'], syll: ['CV', 'CVC'] }
};

let currentConlangData = null;

// Distribuzione normale per lunghezza parole (Box-Muller Transform)
function getGaussianLength(mean, stdDev) {
    let u1 = 0, u2 = 0;
    while (u1 === 0) u1 = Math.random();
    while (u2 === 0) u2 = Math.random();
    let z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
    let len = Math.round(mean + z0 * stdDev);
    return Math.max(2, Math.min(15, len)); // Troncamento nei limiti [2, 15]
}

function getRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function generateTargetWord(vowels, consonants, syllStructures, targetLength) {
    let word = "";
    while (word.length < targetLength) {
        let struct = getRandom(syllStructures);
        for (let char of struct) {
            if (char === 'C') word += getRandom(consonants);
            if (char === 'V') word += getRandom(vowels);
            if (word.length >= targetLength) break;
        }
    }
    return word.substring(0, targetLength);
}

function buildStructuredConlang(config) {
    let v = config.vowels.length ? config.vowels : PHONETIC_PROFILES[config.desc].v;
    let c = config.consonants.length ? config.consonants : PHONETIC_PROFILES[config.desc].c;
    let syll = PHONETIC_PROFILES[config.desc].syll;
    let order = 'SVO';

    if (config.culture === 'ancient' || config.culture === 'primitive') order = 'SOV';
    if (config.culture === 'alien') order = 'OVS';

    // Generazione Affissi Modificatori Universali
    let prefNeg = generateTargetWord(v, c, syll, 3);
    let prefSuper = generateTargetWord(v, c, syll, 3);
    let suffPosto = generateTargetWord(v, c, syll, 3);

    let lexiconMap = {};
    let usedWords = new Set();

    function createUniqueWord() {
        let word;
        let attempts = 0;
        do {
            let targetLen = getGaussianLength(config.meanLength, config.stdDev);
            word = generateTargetWord(v, c, syll, targetLen);
            attempts++;
        } while (usedWords.has(word) && attempts < 100);
        usedWords.add(word);
        return word;
    }

    // 1. Popolamento Radici Primitive
    GRAMMAR_PRIMITIVES.forEach(item => { lexiconMap[item.id] = { parola: createUniqueWord(), concept: item.concept, pos: item.pos, type: "Base Primitiva" }; });
    VERBS_PRIMITIVES.forEach(item => { lexiconMap[item.id] = { parola: createUniqueWord(), concept: item.concept, pos: item.pos, type: "Verbo Base" }; });
    NOUNS_PRIMITIVES.forEach(item => { lexiconMap[item.id] = { parola: createUniqueWord(), concept: item.concept, pos: item.pos, type: "Sostantivo Base" }; });
    ADJECTIVES_BASE.forEach(item => { lexiconMap[item.id] = { parola: createUniqueWord(), concept: item.concept, pos: item.pos, type: "Aggettivo Base" }; });

    // 2. Derivazione e Regole Affissali
    let derivedWords = [
        { id: "a_cattivo", parola: prefNeg + "-" + lexiconMap["a_buono"].parola, concept: "cattivo / dannoso (anti-buono)", pos: "ADJ", type: "Derivato Prefisso" },
        { id: "a_freddo", parola: prefNeg + "-" + lexiconMap["a_caldo"].parola, concept: "freddo / assenza calore (anti-caldo)", pos: "ADJ", type: "Derivato Prefisso" },
        { id: "a_vecchio", parola: prefNeg + "-" + lexiconMap["a_nuovo"].parola, concept: "vecchio / antico (anti-nuovo)", pos: "ADJ", type: "Derivato Prefisso" },
        { id: "a_lento", parola: prefNeg + "-" + lexiconMap["a_veloce"].parola, concept: "lento / poco rapido (anti-veloce)", pos: "ADJ", type: "Derivato Prefisso" },
        { id: "a_enorme", parola: prefSuper + "-" + lexiconMap["a_grande"].parola, concept: "enorme / immenso (super-grande)", pos: "ADJ", type: "Derivato Prefisso" },
        
        { id: "n_panificio", parola: lexiconMap["n_pane"].parola + "-" + suffPosto, concept: "panificio / luogo del pane", pos: "N", type: "Derivato Suffisso" },
        { id: "n_biblioteca", parola: lexiconMap["n_libro"].parola + "-" + suffPosto, concept: "biblioteca / luogo dei libri", pos: "N", type: "Derivato Suffisso" }
    ];

    derivedWords.forEach(item => { lexiconMap[item.id] = item; });

    // 3. Parole Composite ("Parole Lego")
    let compoundWords = [
        { id: "n_cascata", parola: lexiconMap["n_acqua"].parola + lexiconMap["v_cadere"].parola, concept: "cascata (acqua + cadere)", pos: "N", type: "Composto" },
        { id: "n_lacrima", parola: lexiconMap["n_occhio"].parola + lexiconMap["n_acqua"].parola, concept: "lacrima (occhio + acqua)", pos: "N", type: "Composto" },
        { id: "n_vulcano", parola: lexiconMap["n_fuoco"].parola + lexiconMap["n_montagna"].parola, concept: "vulcano (fuoco + montagna)", pos: "N", type: "Composto" },
        { id: "n_medico", parola: lexiconMap["n_persona"].parola + lexiconMap["n_medicina"].parola, concept: "medico (persona + medicina)", pos: "N", type: "Composto" }
    ];

    compoundWords.forEach(item => { lexiconMap[item.id] = item; });

    let finalLexicon = Object.values(lexiconMap);

    currentConlangData = {
        metadata: {
            lunghezzaMediaTarget: config.meanLength,
            deviazioneStandard: config.stdDev,
            ordineSintattico: order,
            prefissoOpposto: prefNeg,
            prefissoSuperlativo: prefSuper,
            suffissoLuogo: suffPosto,
            ambienteCulturale: config.culture
        },
        lexicon: finalLexicon
    };

    // Output Formattato
    let text = `=== PROFILO STATISTICO E MORFOLOGICO ===\n`;
    text += `Lunghezza Media Target  : ${config.meanLength} caratteri (Dev. Std: ${config.stdDev})\n`;
    text += `Prefisso Opposto (Anti-) : ${prefNeg}-\n`;
    text += `Prefisso Superlativo     : ${prefSuper}-\n`;
    text += `Suffisso Luogo (-Posto)  : -${suffPosto}\n`;
    text += `Ordine Sintattico        : ${order}\n\n`;

    text += `=== DIZIONARIO E REGOLE DI DERIVAZIONE (${finalLexicon.length} Termini) ===\n`;
    text += `${"PAROLA".padEnd(20, ' ')} | ${"POS".padEnd(6, ' ')} | ${"TIPO MORFOLOGICO".padEnd(20, ' ')} | CONCETTO / DERIVAZIONE\n`;
    text += `-`.repeat(85) + `\n`;

    finalLexicon.forEach(entry => {
        text += `${entry.parola.padEnd(20, ' ')} | ${entry.pos.padEnd(6, ' ')} | ${entry.type.padEnd(20, ' ')} | ${entry.concept}\n`;
    });

    return text;
}

function generateRandomConlang() {
    const config = {
        meanLength: (Math.random() * 4 + 4).toFixed(1),
        stdDev: (Math.random() * 1.5 + 0.5).toFixed(1),
        vowels: [],
        consonants: [],
        desc: getRandom(['none', 'musical', 'dark', 'magic', 'harsh', 'aquatic']),
        socio: getRandom(['egalitarian', 'hierarchical', 'caste']),
        culture: getRandom(['primitive', 'ancient', 'medieval', 'renaissance', 'alien'])
    };

    document.getElementById('mean-length').value = config.meanLength;
    document.getElementById('std-dev').value = config.stdDev;
    document.getElementById('output').innerText = buildStructuredConlang(config);
}

function generateCustomConlang() {
    const vInput = document.getElementById('custom-vowels').value;
    const cInput = document.getElementById('custom-cons').value;

    const config = {
        meanLength: parseFloat(document.getElementById('mean-length').value),
        stdDev: parseFloat(document.getElementById('std-dev').value),
        vowels: vInput ? vInput.split(',').map(s => s.trim()) : [],
        consonants: cInput ? cInput.split(',').map(s => s.trim()) : [],
        desc: document.getElementById('desc').value,
        socio: document.getElementById('socio').value,
        culture: document.getElementById('culture').value
    };

    document.getElementById('output').innerText = buildStructuredConlang(config);
}

function exportJSON() {
    if (!currentConlangData) return alert("Errore: Genera prima una conlang.");
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentConlangData, null, 2));
    const btn = document.createElement('a');
    btn.setAttribute("href", dataStr);
    btn.setAttribute("download", `conlang_statistica.json`);
    document.body.appendChild(btn);
    btn.click();
    btn.remove();
}

function exportCSV() {
    if (!currentConlangData) return alert("Errore: Genera prima una conlang.");
    let csvContent = "data:text/csv;charset=utf-8,Parola,POS,TipoMorfologico,Concetto\n";
    currentConlangData.lexicon.forEach(item => {
        csvContent += `"${item.parola}","${item.pos}","${item.type}","${item.concept}"\n`;
    });
    const btn = document.createElement("a");
    btn.setAttribute("href", encodeURI(csvContent));
    btn.setAttribute("download", `conlang_statistica.csv`);
    document.body.appendChild(btn);
    btn.click();
    btn.remove();
}
</script>

</body>
</html>
