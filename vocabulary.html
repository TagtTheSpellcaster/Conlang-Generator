<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conlang Vocabulary</title>
    <link rel="stylesheet" href="css/vocabulary.css">
</head>
<body>
<header>
    <div>
        <h1>Conlang Vocabulary</h1>
        <div id="databaseStatus" class="database-status">Loading...</div>
        <div class="database-format-note">Schema v2 · validated with the same rules as <code>node tools/validate.mjs</code> · <a href="index.html" style="color:inherit">Generator</a></div>
    </div>
    <div class="statistics">
        <span>Total: <strong id="totalCount">0</strong></span>
        <span>Visible: <strong id="visibleCount">0</strong></span>
    </div>
</header>

<main>
    <section class="controls">
        <div class="search">
            <label for="searchVocabulary">Search</label>
            <input id="searchVocabulary" type="search" placeholder="Search vocabulary...">
        </div>
        <div id="attributeFilters" class="filters"></div>
        <div class="sorting">
            <div><label for="sortAttribute">Sort by</label><select id="sortAttribute"></select></div>
            <div><label for="sortDirection">Direction</label><select id="sortDirection"><option value="asc">A → Z</option><option value="desc">Z → A</option></select></div>
        </div>
    </section>

    <section class="actions">
        <button id="reloadVocabulary">Reload from JSON</button>
        <button id="appendVocabulary">Append JSON</button>
        <button id="addVocabulary">Add term</button>
        <button id="saveVocabulary" class="primary">Save to data/vocabulary.json</button>
        <button id="exportVocabulary">Download vocabulary.json</button>
        <button id="resetVocabulary">Reset local changes</button>
    </section>

    <div id="errorMessage" class="error" hidden></div>

    <section class="table-container">
        <table>
            <thead><tr>
                <th>#</th><th>ID</th><th>Lemma</th><th>Gloss</th><th>POS</th><th>Domain</th><th>Group</th><th>Tier</th>
                <th>Region</th><th>Culture</th><th>Biome</th><th>Era</th><th>Tags</th><th>Features</th><th>Relations</th><th>Actions</th>
            </tr></thead>
            <tbody id="vocabularyBody"></tbody>
        </table>
    </section>
</main>

<div id="appendModal" class="modal" hidden>
    <div class="modal-panel">
        <div class="modal-header"><h2>Append vocabulary</h2><button class="modal-close" data-close-modal="appendModal" aria-label="Close">×</button></div>
        <p id="appendFilename"></p>
        <div id="appendSummary" class="append-summary"></div>
        <div id="appendErrors" class="validation-errors" hidden></div>
        <div class="modal-actions"><button id="cancelAppend">Cancel</button><button id="confirmAppend" disabled>Append entries</button></div>
    </div>
</div>

<div id="entryModal" class="modal" hidden>
    <div class="modal-panel modal-panel-large">
        <div class="modal-header"><h2 id="entryModalTitle">Add vocabulary entry</h2><button class="modal-close" data-close-modal="entryModal" aria-label="Close">×</button></div>
        <form id="entryForm">
            <div class="form-grid">
                <label>ID<input id="entryId" required placeholder="domain.name"></label>
                <label>Lemma<input id="entryLemma" required placeholder="no “to”, no underscores"></label>
                <label>Gloss (optional)<input id="entryGloss" placeholder="disambiguates homonyms, e.g. of fish"></label>
                <label>POS<select id="entryPos"></select></label>
                <label>Domain<select id="entryDomain"></select></label>
                <label>Group<input id="entryGroup" required></label>
                <label>Tier<select id="entryTier"></select></label>
                <label>Region<input id="entryRegion" placeholder="africa, europe"></label>
                <label>Culture<input id="entryCulture" placeholder="tribal, nomadic, urban"></label>
                <label>Biome<input id="entryBiome" placeholder="savanna, desert, space"></label>
                <label>Era<input id="entryEra" placeholder="ancient, medieval, futuristic"></label>
            </div>
            <label>Tags<input id="entryTags" placeholder="animal, domestic, fantasy"></label>
            <label>Features (JSON)<textarea id="entryFeatures">{}</textarea></label>
            <label>Relations (JSON, values are arrays of ids; inverses are added automatically)<textarea id="entryRelations">{}</textarea></label>
            <div id="entryFormError" class="validation-errors" hidden></div>
            <div class="modal-actions"><button type="button" data-close-modal="entryModal">Cancel</button><button type="submit">Save entry</button></div>
        </form>
    </div>
</div>

<input id="appendFileInput" type="file" accept=".json,application/json" hidden>
<script type="module" src="src/ui/vocabulary-manager.js"></script>
</body>
</html>
